name: SOLVER — Autonomous Prize Hunt

# Runs daily at 6am UTC. No local machine needed. Fully autonomous.
# Finds open bounties → Claude reads issue → writes fix → submits PR → wins prizes.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   SOLVER_GITHUB_TOKEN   — PAT with repo + workflow scopes (not GITHUB_TOKEN, which is read-only here)
#   ANTHROPIC_API_KEY     — Claude for reading issues + writing code
#   GROQ_API_KEY          — Groq for fast pre-screening
#   WALLET_ADDRESS        — EVM wallet for crypto prize payouts
#   PAYOUT_EMAIL          — email for USD prize payouts (IssueHunt etc.)
#
# NSPFRNP → ∞⁹

on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC daily
    - cron: '0 18 * * *'     # 18:00 UTC daily (twice daily for higher throughput)
  workflow_dispatch:          # manual trigger from GitHub UI — zero human friction

jobs:
  solve:
    name: Autonomous Bounty Solve
    runs-on: ubuntu-latest
    timeout-minutes: 55       # Give solver full 55m; GitHub Actions limit is 6h

    steps:
      # Uses SOLVER_GITHUB_TOKEN (PAT) when available so git push works in the commit step.
      # Falls back to the built-in github.token for public-repo checkouts when secret is absent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SOLVER_GITHUB_TOKEN || github.token }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Diagnose which secrets are live this cycle (values never printed, only presence).
      - name: Secret presence check
        run: |
          echo "SOLVER_GITHUB_TOKEN set: ${{ secrets.SOLVER_GITHUB_TOKEN != '' }}"
          echo "ANTHROPIC_API_KEY   set: ${{ secrets.ANTHROPIC_API_KEY   != '' }}"
          echo "GROQ_API_KEY        set: ${{ secrets.GROQ_API_KEY        != '' }}"
          echo "RESEND_API_KEY      set: ${{ secrets.RESEND_API_KEY      != '' }}"

      # Entrypoint is run.js solve — loads LATTICE, calls solver.solve(), writes results back.
      # continue-on-error: true so a solver crash (e.g. API down) never kills the whole job.
      - name: Run SOLVER (Algora · IssueHunt · Gitcoin — ZHI)
        continue-on-error: true
        run: node hive/run.js solve
        env:
          GITHUB_TOKEN:          ${{ secrets.SOLVER_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          WALLET_ADDRESS:        ${{ secrets.WALLET_ADDRESS }}
          PAYOUT_EMAIL:          ${{ secrets.PAYOUT_EMAIL }}
          MIN_BOUNTY_USD:        '500'
          MATCH_THRESHOLD:       '0.80'
          FEASIBILITY_THRESHOLD: '0.80'
          SOLVER_MAX_ATTEMPTS:   '5'

      - name: Run Email Outbound (ZHI)
        continue-on-error: true
        run: node hive/run.js email
        env:
          GITHUB_TOKEN:           ${{ secrets.SOLVER_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:         ${{ secrets.RESEND_API_KEY }}
          EMAIL_OUTBOUND_TARGETS: ${{ secrets.EMAIL_OUTBOUND_TARGETS }}

      # Solver and email both mutate LATTICE.json; commit saves state for next cycle.
      # continue-on-error: true so a push failure (missing PAT scope) never kills the job.
      - name: Commit LATTICE.json updates
        continue-on-error: true
        run: |
          git config user.name  "SING9 Hive"
          git config user.email "hive@fractiai.com"
          git add hive/LATTICE.json
          if git diff --cached --quiet; then
            echo "No LATTICE changes to commit this cycle."
          else
            git commit -m "hive: solver+echo cycle $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            git push
          fi

      - name: Report status
        if: always()
        run: |
          echo "SOLVER cycle complete — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "NSPFRNP → ∞⁹"
