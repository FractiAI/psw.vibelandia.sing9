name: SOLVER — Autonomous Prize Hunt

# Runs daily at 6am UTC. No local machine needed. Fully autonomous.
# Finds open bounties → Claude reads issue → writes fix → submits PR → wins prizes.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   SOLVER_GITHUB_TOKEN   — PAT with repo + workflow scopes (not GITHUB_TOKEN, which is read-only here)
#   ANTHROPIC_API_KEY     — Claude for reading issues + writing code
#   GROQ_API_KEY          — Groq for fast pre-screening
#   WALLET_ADDRESS        — EVM wallet for crypto prize payouts
#   PAYOUT_EMAIL          — email for USD prize payouts (IssueHunt etc.)
#
# NSPFRNP → ∞⁹

on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC daily
    - cron: '0 18 * * *'     # 18:00 UTC daily (twice daily for higher throughput)
  workflow_dispatch:          # manual trigger from GitHub UI — zero human friction

jobs:
  solve:
    name: Autonomous Bounty Solve
    runs-on: ubuntu-latest
    timeout-minutes: 55       # Vercel function limit is 60s; give solver full 55m

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SOLVER
        run: node hive/solver.js
        env:
          GITHUB_TOKEN:        ${{ secrets.SOLVER_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          WALLET_ADDRESS:      ${{ secrets.WALLET_ADDRESS }}
          PAYOUT_EMAIL:        ${{ secrets.PAYOUT_EMAIL }}
          MIN_BOUNTY_USD:      '100'
          SOLVER_MAX_ATTEMPTS: '5'

      - name: Run Email Outbound (ZHI)
        run: node hive/run.js email
        env:
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:            ${{ secrets.RESEND_API_KEY }}
          EMAIL_OUTBOUND_TARGETS:    ${{ secrets.EMAIL_OUTBOUND_TARGETS }}

      - name: Report status
        if: always()
        run: |
          echo "SOLVER cycle complete — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "NSPFRNP → ∞⁹"
