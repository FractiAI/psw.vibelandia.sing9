<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06080d" />
  <title>Snap robots · quick demo</title>
  <meta name="description" content="Pick a song, tap Go, watch two little robots move with the music. Simple demo." />
  <link rel="canonical" href="https://psw-vibelandia-sing9.vercel.app/interfaces/digital-pru-snap-robots.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #06080d;
      --card: #121a28;
      --gold: #d4af37;
      --gold-hi: #fef3c7;
      --foam: #5eead4;
      --muted: #94a3b8;
      --text: #f1f5f9;
      --line: rgba(212, 175, 55, 0.3);
    }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 1rem;
      min-height: 100vh;
      padding: 1rem 1rem 2rem;
    }
    a { color: var(--foam); }
    .wrap { max-width: 520px; margin: 0 auto; }
    .back {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 0.75rem;
    }
    .back:hover { color: var(--gold-hi); }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-hi);
      margin-bottom: 0.35rem;
    }
    .tag { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.25rem; }

    .controls {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    #cmd {
      width: 100%;
      min-height: 4.5rem;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #0a0e16;
      color: var(--gold-hi);
      padding: 0.6rem 0.65rem;
      font-family: inherit;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    #cmd::placeholder { color: #64748b; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .file-btn {
      display: inline-block;
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--gold-hi);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .file-btn:hover { border-color: var(--gold); }
    .go-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .go {
      flex: 1;
      min-width: 8rem;
      padding: 0.85rem 1.25rem;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #e8c547, var(--gold));
      color: #0a0f1a;
      cursor: pointer;
    }
    .go:hover { filter: brightness(1.05); }
    .go:disabled { opacity: 0.5; cursor: wait; }
    .stop {
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .stop:hover { color: var(--gold-hi); border-color: var(--gold); }
    .status {
      margin-top: 0.65rem;
      font-size: 0.85rem;
      color: var(--foam);
      min-height: 1.25rem;
    }

    .viewport {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #080a10;
      min-height: min(48vh, 400px);
    }
    #wh-canvas {
      display: block;
      width: 100%;
      height: min(48vh, 400px);
    }
    .robot-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.35rem 0.4rem 0.5rem;
      background: linear-gradient(0deg, rgba(6, 8, 13, 0.92) 0%, transparent 100%);
      pointer-events: none;
    }
    .robot-overlay figure {
      border: 1px solid rgba(94, 234, 212, 0.35);
      border-radius: 8px;
      background: rgba(8, 10, 16, 0.5);
      padding: 0.2rem 0.3rem;
      margin: 0;
    }
    .robot-overlay figcaption {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 0.2rem;
      text-align: center;
    }
    .robot-overlay svg { width: 100%; max-width: 140px; height: auto; display: block; margin: 0 auto; }

    .fine-print { margin-top: 1rem; font-size: 0.78rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="vibelandia-questfest.html">← Back to festival</a>
    <header>
      <h1>Snap robots</h1>
      <p class="tag">Pick a song, tap <strong>Go</strong>, and watch the two robots play along.</p>
    </header>

    <section class="controls" aria-label="Demo controls">
      <label class="visually-hidden" for="cmd">Optional note</label>
      <textarea id="cmd" placeholder="Optional: a short note (you can leave this blank)"></textarea>
      <input type="file" id="track" class="visually-hidden" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" />
      <label class="file-btn" for="track">Choose audio file</label>
      <div class="go-row">
        <button type="button" class="go" id="btnGo">Go</button>
        <button type="button" class="stop" id="btnStop">Stop</button>
      </div>
      <p class="status" id="playStatus" aria-live="polite"></p>
    </section>

    <section class="viewport" id="wh-stage" data-gl="pending" aria-label="Robot scene">
      <canvas id="wh-canvas"></canvas>
      <div class="robot-overlay">
        <figure>
          <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="ga" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#2a3144"/><stop offset="100%" style="stop-color:#121a2a"/>
              </linearGradient>
            </defs>
            <g id="bot-a-root" transform="translate(100,200)">
              <rect x="-28" y="-95" width="56" height="95" rx="10" fill="url(#ga)" stroke="#d4af37" stroke-width="2"/>
              <circle cx="0" cy="-118" r="22" fill="#1a2233" stroke="#d4af37" stroke-width="2"/>
              <g id="bot-a-arm" transform="translate(28,-78)">
                <rect x="0" y="-8" width="12" height="62" rx="4" fill="#d4af37" stroke="#fef3c7" stroke-width="1"/>
              </g>
              <g transform="translate(-28,-78) scale(-1,1)">
                <rect x="0" y="-8" width="12" height="62" rx="4" fill="#8b7355" stroke="#d4af37" stroke-width="1"/>
              </g>
              <rect x="-32" y="0" width="64" height="14" rx="4" fill="#0f141c" stroke="#2dd4bf" stroke-width="1"/>
            </g>
          </svg>
          <figcaption>Left · plays the beat</figcaption>
        </figure>
        <figure>
          <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#1e293b"/><stop offset="100%" style="stop-color:#0f172a"/>
              </linearGradient>
            </defs>
            <g id="bot-b-root" transform="translate(100,200)">
              <rect x="-26" y="-88" width="52" height="88" rx="10" fill="url(#gb)" stroke="#2dd4bf" stroke-width="2"/>
              <circle cx="0" cy="-110" r="20" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
              <rect id="bot-b-leg-l" x="-22" y="-5" width="16" height="40" rx="4" fill="#2dd4bf" opacity="0.85"/>
              <rect id="bot-b-leg-r" x="6" y="-5" width="16" height="40" rx="4" fill="#14b8a6" opacity="0.85"/>
              <rect x="-30" y="0" width="60" height="12" rx="4" fill="#0f141c" stroke="#d4af37" stroke-width="1"/>
            </g>
          </svg>
          <figcaption>Right · dances along</figcaption>
        </figure>
      </div>
    </section>

    <p class="fine-print"><a href="/surfaces.html">Site map</a></p>
  </div>

  <script>
(function () {
  var cmdEl = document.getElementById("cmd");
  var trackEl = document.getElementById("track");
  var btnGo = document.getElementById("btnGo");
  var btnStop = document.getElementById("btnStop");
  var playStatus = document.getElementById("playStatus");
  var whStage = document.getElementById("wh-stage");
  var botA = document.getElementById("bot-a-root");
  var botAArm = document.getElementById("bot-a-arm");
  var botB = document.getElementById("bot-b-root");
  var botBL = document.getElementById("bot-b-leg-l");
  var botBR = document.getElementById("bot-b-leg-r");

  window.__snapEnergy = { bass: 0, mid: 0, high: 0, t: 0, carbon: null };
  var ctx = null;
  var sourceNode = null;
  var analyser = null;
  var rafId = 0;
  var t0 = 0;
  var carbonEma = 0;
  var reduceMotion = false;
  try {
    reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) {}

  function meanSlice(arr, a, b) {
    var s = 0, n = 0;
    for (var i = a; i < b && i < arr.length; i++) {
      s += arr[i];
      n++;
    }
    return n ? s / n : 0;
  }

  function simulateCarbonAwareness(bass, mid, high, wobble) {
    var substrate = Math.min(1, bass * 0.74 + wobble * 0.44 + mid * 0.06);
    var silverBleed = Math.min(1, mid * 0.52 + high * 0.38);
    var rawIndex = Math.min(1, substrate * 0.84 + silverBleed * 0.16);
    carbonEma = carbonEma + (rawIndex - carbonEma) / 1.618;
    return { substrate: substrate, silverBleed: silverBleed, index: carbonEma, rawIndex: rawIndex };
  }

  function stopAll() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    try {
      if (sourceNode) {
        sourceNode.stop(0);
        sourceNode.disconnect();
      }
    } catch (e) {}
    sourceNode = null;
    try {
      if (analyser) analyser.disconnect();
    } catch (e) {}
    analyser = null;
    try {
      if (ctx && ctx.state !== "closed") ctx.close();
    } catch (e) {}
    ctx = null;
    if (botA) botA.setAttribute("transform", "translate(100,200)");
    if (botAArm) botAArm.setAttribute("transform", "translate(28,-78) rotate(0)");
    if (botB) botB.setAttribute("transform", "translate(100,200)");
    if (botBL) botBL.setAttribute("transform", "");
    if (botBR) botBR.setAttribute("transform", "");
    playStatus.textContent = "";
    carbonEma = 0;
    window.__snapEnergy = { bass: 0, mid: 0, high: 0, t: 0, carbon: null };
  }

  function tick() {
    if (!analyser || !ctx) return;
    var freq = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(freq);
    var td = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(td);
    var bass = meanSlice(freq, 1, 12) / 255;
    var mid = meanSlice(freq, 12, 48) / 255;
    var high = meanSlice(freq, 48, 120) / 255;
    var t = ctx.currentTime - t0;
    var wobble = 0;
    for (var i = 0; i < td.length; i += 32) {
      wobble += Math.abs(td[i] - 128);
    }
    wobble = (wobble / (td.length / 32)) / 128;
    var C = simulateCarbonAwareness(bass, mid, high, wobble);

    if (reduceMotion) {
      botA.setAttribute("transform", "translate(100," + (200 - C.substrate * 8) + ")");
      botB.setAttribute("transform", "translate(100,200) rotate(" + (C.silverBleed * 6).toFixed(1) + ")");
    } else {
      var armRot = -35 + C.substrate * 58 + C.silverBleed * 18;
      botAArm.setAttribute("transform", "translate(28,-78) rotate(" + armRot.toFixed(1) + ")");
      var sway = Math.sin(t * 5.1) * (4 + C.silverBleed * 16 + C.index * 6);
      botA.setAttribute(
        "transform",
        "translate(" +
          (100 + sway * 0.35).toFixed(1) +
          "," +
          (200 - C.substrate * 20 - wobble * 3.5 - C.index * 4).toFixed(1) +
          ") rotate(" +
          (C.substrate * 9 - C.silverBleed * 3).toFixed(2) +
          ")"
      );
      var spin = Math.sin(t * (3 + C.silverBleed * 5)) * (14 + C.silverBleed * 42 + C.index * 12);
      var bounce = Math.abs(Math.sin(t * 6.28 * (0.5 + C.substrate))) * (10 + C.silverBleed * 22);
      botB.setAttribute("transform", "translate(100," + (200 - bounce).toFixed(1) + ") rotate(" + spin.toFixed(2) + ")");
      var kick = C.silverBleed * 11 + C.substrate * 3;
      botBL.setAttribute("transform", "translate(0," + (kick + Math.sin(t * 7) * 6).toFixed(1) + ")");
      botBR.setAttribute("transform", "translate(0," + (-kick + Math.cos(t * 6) * 6).toFixed(1) + ")");
    }
    window.__snapEnergy = { bass: bass, mid: mid, high: high, t: t, carbon: C };
    rafId = requestAnimationFrame(tick);
  }

  btnStop.addEventListener("click", function () {
    stopAll();
  });

  btnGo.addEventListener("click", function () {
    var file = trackEl.files && trackEl.files[0];
    if (!file) {
      playStatus.textContent = "Choose an audio file first.";
      return;
    }
    stopAll();
    playStatus.textContent = "Loading…";

    var reader = new FileReader();
    reader.onload = function () {
      var buf = reader.result;
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      var copy = buf.slice(0);
      ctx.decodeAudioData(
        copy,
        function (audioBuf) {
          t0 = ctx.currentTime;
          analyser = ctx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.65;
          sourceNode = ctx.createBufferSource();
          sourceNode.buffer = audioBuf;
          sourceNode.connect(analyser);
          analyser.connect(ctx.destination);
          sourceNode.onended = function () {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = 0;
            playStatus.textContent = "Done.";
          };
          ctx.resume().then(function () {
            sourceNode.start(0);
            playStatus.textContent = "Playing.";
            rafId = requestAnimationFrame(tick);
          });
        },
        function () {
          playStatus.textContent = "Could not open that file. Try MP3 or WAV.";
        }
      );
    };
    reader.onerror = function () {
      playStatus.textContent = "Could not read the file.";
    };
    reader.readAsArrayBuffer(file);
  });

  (function bootWarehouse() {
    var canvas = document.getElementById("wh-canvas");
    if (!canvas || !window.Promise) {
      if (whStage) whStage.setAttribute("data-gl", "err");
      return;
    }
    var PH = "https://dl.polyhaven.org/file/ph-assets";
    var HDR_TRIES = [
      PH + "/HDRIs/hdr/1k/aircraft_workshop_01_1k.hdr",
      PH + "/HDRIs/hdr/1k/abandoned_hangar_01_1k.hdr",
      PH + "/HDRIs/hdr/1k/studio_small_07_1k.hdr",
      PH + "/HDRIs/hdr/1k/industrial_sunset_02_1k.hdr",
    ];
    var TEX = {
      floor: PH + "/Textures/jpg/1k/metal_floor_001/metal_floor_001_diff_1k.jpg",
      wall: PH + "/Textures/jpg/1k/concrete_wall_003/concrete_wall_003_diff_1k.jpg",
      crate: PH + "/Textures/jpg/1k/rough_wood/rough_wood_diff_1k.jpg",
    };
    Promise.all([
      import("three"),
      import("three/addons/loaders/RGBELoader.js"),
      import("three/addons/controls/OrbitControls.js"),
    ])
      .then(function (mods) {
        var T = mods[0];
        var RGBELoader = mods[1].RGBELoader;
        var OrbitControls = mods[2].OrbitControls;

        var scene = new T.Scene();
        scene.fog = new T.Fog(0x0d1018, 10, 34);

        var renderer = new T.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          alpha: false,
          powerPreference: "high-performance",
        });
        var pr = Math.min(window.devicePixelRatio || 1, 2);
        function sizeNow() {
          var box = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : { width: 800 };
          var h = Math.min(window.innerHeight * 0.48, 400);
          var w = Math.max(280, box.width | 0);
          renderer.setPixelRatio(pr);
          renderer.setSize(w, h | 0, false);
          return { w: w, h: h | 0 };
        }
        sizeNow();
        if (T.SRGBColorSpace) renderer.outputColorSpace = T.SRGBColorSpace;
        renderer.toneMapping = T.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.76;
        renderer.shadowMap.enabled = true;

        var camera = new T.PerspectiveCamera(48, 1, 0.12, 80);
        function syncCam() {
          var d = sizeNow();
          camera.aspect = d.w / Math.max(1, d.h);
          camera.updateProjectionMatrix();
        }
        syncCam();
        camera.position.set(-1.1, 1.95, 7.35);
        camera.lookAt(0, 1.05, -2);

        var hemi = new T.HemisphereLight(0x8cb4ff, 0x1a140c, 0.32);
        scene.add(hemi);
        var spot = new T.SpotLight(0xfff2d6, 12, 28, 0.52, 0.45, 1);
        spot.position.set(2.8, 6.8, 3.2);
        spot.target.position.set(0, 0, -2);
        spot.castShadow = true;
        scene.add(spot);
        scene.add(spot.target);

        var hdrLoader = new RGBELoader();
        function loadHdrAttempt(i) {
          if (i >= HDR_TRIES.length) {
            scene.background = new T.Color(0x12161f);
            return;
          }
          hdrLoader.load(
            HDR_TRIES[i],
            function (tex) {
              var localPmrem = new T.PMREMGenerator(renderer);
              localPmrem.compileEquirectangularShader();
              try {
                var rt = localPmrem.fromEquirectangular(tex);
                scene.environment = rt.texture;
                scene.background = rt.texture;
              } catch (err) {
                loadHdrAttempt(i + 1);
              }
              tex.dispose();
              localPmrem.dispose();
            },
            undefined,
            function () {
              loadHdrAttempt(i + 1);
            }
          );
        }
        loadHdrAttempt(0);

        var texLoader = new T.TextureLoader();
        texLoader.crossOrigin = "anonymous";
        function loadMat(url, repeatX, repeatY) {
          var mat = new T.MeshStandardMaterial({ color: 0x3a4049, roughness: 0.9, metalness: 0.1 });
          texLoader.load(
            url,
            function (t) {
              t.wrapS = t.wrapT = T.RepeatWrapping;
              t.repeat.set(repeatX, repeatY);
              if (T.SRGBColorSpace) t.colorSpace = T.SRGBColorSpace;
              mat.map = t;
              mat.needsUpdate = true;
            },
            undefined,
            function () {}
          );
          return mat;
        }

        var floorMat = loadMat(TEX.floor, 5, 5);
        var floor = new T.Mesh(new T.PlaneGeometry(28, 28, 1, 1), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        var wallMat = loadMat(TEX.wall, 2.4, 1.15);
        function wallMesh(w, h, x, z, ry) {
          var m = new T.Mesh(new T.PlaneGeometry(w, h), wallMat);
          m.position.set(x, h / 2, z);
          m.rotation.y = ry;
          m.receiveShadow = true;
          return m;
        }
        scene.add(wallMesh(24, 6.2, 0, -8.6, 0));
        scene.add(wallMesh(18, 6.2, -10.4, -0.4, Math.PI / 2));
        scene.add(wallMesh(18, 6.2, 10.4, 0, -Math.PI / 2));

        var crateMat = loadMat(TEX.crate, 1, 1);
        function crate(x, z, sx, sy, sz) {
          var g = new T.Mesh(new T.BoxGeometry(sx, sy, sz), crateMat);
          g.position.set(x, sy / 2, z);
          g.castShadow = true;
          g.receiveShadow = true;
          return g;
        }
        var crates = [crate(-4.1, -2.9, 1.1, 1.35, 1.0), crate(3.5, -3.4, 1.35, 0.95, 1.15), crate(0.4, -1.1, 0.9, 1.05, 0.85)];
        crates.forEach(function (c) {
          scene.add(c);
        });

        var controls = new OrbitControls(camera, canvas);
        controls.target.set(0, 1, -2);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI * 0.495;
        controls.minDistance = 3.6;
        controls.maxDistance = 14;

        var baseY = crates.map(function (c) {
          return c.position.y;
        });

        function whAnim() {
          requestAnimationFrame(whAnim);
          var e = window.__snapEnergy || { bass: 0, mid: 0, high: 0, t: 0, carbon: null };
          var idle = performance.now() * 0.00085;
          var b = e.bass || 0;
          var m = e.mid || 0;
          var h = e.high || 0;
          var ti = e.t || idle;
          var C = e.carbon;
          var sub = C ? C.substrate : b;
          var silv = C ? C.silverBleed : m * 0.55 + h * 0.3;
          var idx = C ? C.index : b * 0.85;
          spot.intensity = 5 + sub * 26 + silv * 9 + idx * 4;
          hemi.intensity = 0.2 + silv * 0.32 + sub * 0.12;
          crates[0].position.y = baseY[0] + sub * 0.42 + Math.sin(ti * 6) * 0.028;
          crates[1].position.y = baseY[1] + silv * 0.34 + idx * 0.06;
          crates[1].rotation.y = Math.sin(ti * 3 + silv * 2.6) * 0.3;
          crates[2].position.y = baseY[2] + sub * 0.12 + m * 0.14 + Math.cos(ti * 5) * 0.048;
          controls.update();
          renderer.render(scene, camera);
        }
        whAnim();

        window.addEventListener(
          "resize",
          function () {
            syncCam();
          },
          { passive: true }
        );

        if (whStage) whStage.setAttribute("data-gl", "ok");
      })
      .catch(function () {
        if (whStage) whStage.setAttribute("data-gl", "err");
      });
  })();
