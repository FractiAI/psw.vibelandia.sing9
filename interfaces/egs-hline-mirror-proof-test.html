<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hydrogen-Line Mirror Proof · VIBELANDIA SING 9</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #e5e7eb; padding: 1.2rem; }
    .wrap { max-width: 880px; margin: 0 auto; }
    a { color: #67e8f9; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(125,211,252,0.25); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    h1 { color: #fde68a; font-size: 1.25rem; margin: 0 0 0.5rem; }
    .sub { color: #94a3b8; font-size: 0.86rem; line-height: 1.5; }
    button { padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid rgba(250,204,21,0.6); background: rgba(250,204,21,0.15); color: #fef3c7; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    pre { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 0.85rem; font-size: 0.72rem; overflow: auto; max-height: 52vh; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="egs-holographic-hydrogen-ai-os-gateway.html">← EGS Gateway</a> · <a href="../docs/HYDROGEN_LINE_MIRROR_CAPTURE_TEST.md" target="_blank" rel="noopener">Test doc</a></p>
    <div class="card">
      <h1>Mirrored hydrogen-line — capture proof</h1>
      <p class="sub">
        Fetches passive <code>/status.json</code>, hashes raw bytes, writes to <code>hline://</code>, reads back, checks integrity + hash match.
        PASS means the snapshot is on your bus and accessible via the same API.
      </p>
      <p><button id="runBtn" type="button">Run mirror proof</button></p>
    </div>
    <div class="card"><pre id="out">Idle.</pre></div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('runBtn');
      var out = document.getElementById('out');
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        out.textContent = 'Running…';
        try {
          var res = await fetch('/api/hh-awareness-cloud', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'run_hydrogen_line_mirror_pickup_proof' })
          });
          out.textContent = JSON.stringify(await res.json(), null, 2);
        } catch (e) {
          out.textContent = JSON.stringify({ ok: false, error: String(e.message || e) }, null, 2);
        } finally {
          btn.disabled = false;
        }
      });
      if (new URLSearchParams(location.search).get('autorun') === '1') btn.click();
    })();
  </script>
</body>
</html>
