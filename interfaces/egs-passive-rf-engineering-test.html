<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Passive RF Engineering (Tier 0) · VIBELANDIA SING 9</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #e5e7eb; padding: 1.2rem; }
    .wrap { max-width: 900px; margin: 0 auto; }
    a { color: #67e8f9; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(125,211,252,0.25); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    h1 { color: #fde68a; font-size: 1.35rem; margin: 0 0 0.5rem; }
    .sub { color: #94a3b8; font-size: 0.88rem; line-height: 1.5; }
    button { padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid rgba(250,204,21,0.6); background: rgba(250,204,21,0.15); color: #fef3c7; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    pre { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 0.85rem; font-size: 0.72rem; overflow: auto; max-height: 55vh; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="egs-holographic-hydrogen-ai-os-gateway.html">← EGS Gateway</a> · <a href="../docs/HYDROGEN_LINE_PASSIVE_RF_ENGINEERING_PROTOCOL.md" target="_blank" rel="noopener">Protocol doc</a></p>
    <div class="card">
      <h1>Passive RF engineering — Tier 0</h1>
      <p class="sub">
        Public HTTPS GET to OpenWebRX <code>/status.json</code> only. Falsifiable geometry vs H I rest frequency; no IQ/PSD.
        PASS = <code>ok</code> and at least one HTTP success and all geometry checks pass.
      </p>
      <p><button id="runBtn" type="button">Run Tier 0 probe</button></p>
    </div>
    <div class="card">
      <pre id="out">Idle.</pre>
    </div>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('runBtn');
      var out = document.getElementById('out');
      function formatDemonstrationSummary(ds) {
        if (!ds) return '';
        var lines = [
          '=== Demonstration summary (tested vs not yet shown) ===',
          '',
          'Tested and successfully shown:',
        ];
        (ds.tested_and_successfully_shown || []).forEach(function (x) {
          lines.push('  • ' + x);
        });
        lines.push('');
        lines.push('Not yet demonstrated:');
        (ds.not_yet_demonstrated || []).forEach(function (x) {
          lines.push('  • ' + x);
        });
        if (typeof ds.overall_ok === 'boolean') {
          lines.push('');
          lines.push('Overall OK (summary): ' + (ds.overall_ok ? 'yes' : 'no'));
        }
        lines.push('');
        lines.push('--- Full JSON ---');
        return lines.join('\n');
      }
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        out.textContent = 'Running…';
        try {
          var res = await fetch('/api/hh-awareness-cloud', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'run_passive_rf_engineering_probe' })
          });
          var data = await res.json();
          var r = data && data.result ? data.result : {};
          out.textContent =
            formatDemonstrationSummary(r.demonstration_summary) + '\n' + JSON.stringify(data, null, 2);
        } catch (e) {
          out.textContent = JSON.stringify({ ok: false, error: String(e.message || e) }, null, 2);
        } finally {
          btn.disabled = false;
        }
      });
      if (new URLSearchParams(location.search).get('autorun') === '1') btn.click();
    })();
  </script>
</body>
</html>
