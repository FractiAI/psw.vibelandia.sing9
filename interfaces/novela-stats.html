<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Queen's Rush · Novela visitor stats | VIBELANDIA SING 9</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #d4af37; --cream: rgba(253,248,235,0.92); --cream-dim: rgba(253,248,235,0.55); --pink: #e879f9; --bg: #060204; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--cream); min-height: 100vh; padding: 2rem; }
    .topnav { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; font-size: 0.72rem; }
    .topnav a { color: var(--cream-dim); text-decoration: none; }
    .topnav a:hover { color: var(--cream); }
    .brand { font-weight: 800; letter-spacing: 0.16em; color: var(--gold); }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; }
    .sub { font-size: 0.8rem; color: var(--cream-dim); margin-bottom: 2rem; }
    .funnel { display: flex; flex-direction: column; gap: 1rem; max-width: 480px; }
    .funnel-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: rgba(232,121,249,0.06); border: 1px solid rgba(232,121,249,0.2); border-radius: 6px; }
    .funnel-label { flex: 1; font-size: 0.9rem; color: var(--cream); }
    .funnel-count { font-size: 1.5rem; font-weight: 800; color: var(--pink); min-width: 4rem; text-align: right; }
    .funnel-pct { font-size: 0.75rem; color: var(--cream-dim); min-width: 4rem; text-align: right; }
    .funnel-bar-wrap { margin-top: 0.5rem; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    .funnel-bar { height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); border-radius: 2px; transition: width 0.4s ease; }
    .summary { margin-top: 2rem; padding: 1.25rem; background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.2); border-radius: 6px; font-size: 0.85rem; color: var(--cream-dim); }
    .summary strong { color: var(--gold); }
    .refresh { margin-top: 1rem; font-size: 0.75rem; }
    .refresh button { background: transparent; border: 1px solid rgba(212,175,55,0.4); color: var(--gold); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
    .refresh button:hover { background: rgba(212,175,55,0.15); }
    .error { color: #f87171; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="../index.html">VIBELANDIA · SING 9</a>
    <a href="gold-heart-novela.html">← Queen's Rush</a>
    <a href="catalog.html">Content Catalog</a>
  </nav>
  <h1>Queen's Rush · Visitor stats</h1>
  <p class="sub">How many visitors and how far they get (page loads).</p>
  <div id="funnel" class="funnel"></div>
  <div id="summary" class="summary"></div>
  <p class="refresh"><button type="button" id="refresh">Refresh counts</button></p>
  <script>
    (function() {
      var NAMESPACE = 'psw.vibelandia.sing9';
      var PAGES = [
        { key: 'queensrush-landing', label: 'Landing (Queen\'s Rush)', url: 'gold-heart-novela.html' },
        { key: 'queensrush-ch1', label: 'Chapter 1: The Itch', url: 'novela-preview.html' },
        { key: 'queensrush-ch2', label: 'Chapter 2: The Connect', url: 'novela-ch2.html' },
        { key: 'queensrush-ch3', label: 'Chapter 3: The Pattern', url: 'novela-ch3.html' }
      ];
      function getCount(key) {
        return fetch('https://api.countapi.xyz/get/' + NAMESPACE + '/' + key)
          .then(function(r) { return r.json(); })
          .then(function(d) { return d.value != null ? d.value : 0; })
          .catch(function() { return null; });
      }
      function render(landing, ch1, ch2, ch3) {
        var funnel = document.getElementById('funnel');
        var summary = document.getElementById('summary');
        var vals = [landing, ch1, ch2, ch3];
        var max = Math.max.apply(null, vals.concat([1]));
        funnel.innerHTML = PAGES.map(function(p, i) {
          var v = vals[i];
          var pct = landing && v != null ? Math.round(100 * v / landing) + '%' : '—';
          var bar = landing && v != null ? Math.round(100 * v / landing) : 0;
          return '<div class="funnel-row">' +
            '<div class="funnel-label">' + p.label + '</div>' +
            '<div class="funnel-count">' + (v != null ? v : '—') + '</div>' +
            '<div class="funnel-pct">' + (i === 0 ? '100%' : pct) + '</div>' +
            '</div>' +
            '<div class="funnel-bar-wrap"><div class="funnel-bar" style="width:' + (bar || 0) + '%"></div></div>';
        }).join('');
        summary.innerHTML = '<strong>Funnel:</strong> ' + (landing != null ? landing : '—') + ' visitors hit the landing. ' +
          (ch1 != null ? ch1 + ' reached Chapter 1' : '—') +
          (landing && ch1 != null ? ' (' + Math.round(100 * ch1 / landing) + '% of landing)' : '') + '. ' +
          (ch2 != null ? ch2 + ' reached Chapter 2' : '—') +
          (ch1 && ch2 != null ? ' (' + Math.round(100 * ch2 / ch1) + '% of Ch1)' : '') + '. ' +
          (ch3 != null ? ch3 + ' reached Chapter 3' : '—') +
          (ch2 && ch3 != null ? ' (' + Math.round(100 * ch3 / ch2) + '% of Ch2)' : '') + '.';
      }
      function load() {
        Promise.all(PAGES.map(function(p) { return getCount(p.key); }))
          .then(function(vals) {
            render(vals[0], vals[1], vals[2], vals[3]);
          })
          .catch(function() {
            document.getElementById('funnel').innerHTML = '<p class="error">Could not load counts (CORS or network). Open from same origin or try a CORS proxy.</p>';
          });
      }
      document.getElementById('refresh').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
