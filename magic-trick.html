    function analyzeSpectralChunk(acc, binCount, nyquist, centerBin, LINE_HALF_BINS, GUARD_BINS, template) {
      const binHz = nyquist / binCount;
      const templateLen = template.length;
      const lo = Math.max(0, centerBin - GUARD_BINS);
      const hi = Math.min(binCount - 1, centerBin + GUARD_BINS);
      const noiseBins = [];
      for (let i = 0; i < binCount; i++) {
        if (i >= lo && i <= hi) continue;
        noiseBins.push(acc[i]);
      }
      noiseBins.sort((a, b) => a - b);
      const noiseMed = noiseBins.length ? noiseBins[Math.floor(noiseBins.length * 0.5)] : -100;

      const s0 = Math.max(0, centerBin - LINE_HALF_BINS);
      let peakDb = -200;
      let peakBin = centerBin;
      for (let i = 0; i < templateLen && s0 + i < binCount; i++) {
        const b = s0 + i;
        if (acc[b] > peakDb) {
          peakDb = acc[b];
          peakBin = b;
        }
      }
      const snr_db = peakDb - noiseMed;

      const slice = new Float32Array(templateLen);
      for (let i = 0; i < templateLen; i++) slice[i] = Math.max(0, acc[s0 + i] + 100);
      let smin = slice[0],
        smax = slice[0];
      for (let i = 1; i < templateLen; i++) {
        smin = Math.min(smin, slice[i]);
        smax = Math.max(smax, slice[i]);
      }
      const sden = smax - smin + 1e-9;
      let sn = 0,
        sd = 0,
        tn = 0,
        td = 0;
      for (let i = 0; i < templateLen; i++) {
        const sv = (slice[i] - smin) / sden;
        sn += sv * template[i];
        sd += sv * sv;
        tn += template[i];
        td += template[i] * template[i];
      }
      const profile_score = sn / (Math.sqrt(sd) * Math.sqrt(td) + 1e-9);
      const peak_hz = peakBin * binHz;
      return { snr_db, profile_score, peak_hz };
    }

    function medianNum(arr) {
      const s = [...arr].sort((a, b) => a - b);
      const mid = Math.floor(s.length / 2);
      return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
    }

    /**
     * Spectral scan (no network ping): mic + FFT at ~1420.4 Hz acoustic proxy for 1420.4 MHz hydrogen resonance narrative.
     * Chunked aggregation resists single-frame drift from real-time noise shifts.
     */
    async function spectralScanHydrogen1420() {
      const S = SPECTRAL_SINGULARITY;
      const TARGET_HZ = 1420.4;
      const LINE_HALF_BINS = 4;
      const GUARD_BINS = 24;
      const CHUNKS = S.CHUNKS;
      const FRAMES_PER_CHUNK = 7;
      const FRAME_MS = 45;
      const CHUNK_SNR_MIN = S.CHUNK_SNR_MIN;
      const CHUNK_PROF_MIN = S.CHUNK_PROF_MIN;
      const MEDIAN_SNR_MIN = S.MEDIAN_SNR_MIN;
      const MEDIAN_PROF_MIN = S.MEDIAN_PROF_MIN;
      const MIN_CHUNKS_PASS = S.MIN_CHUNKS_PASS;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return {
          ok: false,
          snr_db: null,
          profile_score: null,
          peak_hz: null,
          spectral_wall_ms: null,
          line: 'Spectral scan unavailable (no getUserMedia)',
          detail: 'HTTPS + microphone required for 1420.4 Hz-band scan.',
        };
      }

      let stream = null;
      let ctx = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
          video: false,
        });
      } catch (e) {
        return {
          ok: false,
          snr_db: null,
          profile_score: null,
          peak_hz: null,
          spectral_wall_ms: null,
          line: 'Microphone not granted — spectral scan blocked',
          detail: e.message || String(e),
        };
      }

      try {
        ctx = new AudioContext();
        await ctx.resume();
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 8192;
        analyser.smoothingTimeConstant = 0.12;
        source.connect(analyser);

        const binCount = analyser.frequencyBinCount;
        const nyquist = ctx.sampleRate / 2;
        const binHz = nyquist / binCount;
        const centerBin = Math.min(binCount - 1, Math.max(0, Math.round(TARGET_HZ / binHz)));
        const templateLen = LINE_HALF_BINS * 2 + 1;
        const template = new Float32Array(templateLen);
        const sigma = LINE_HALF_BINS / 2;
        const mid = LINE_HALF_BINS;
        let tsum = 0;
        for (let i = 0; i < templateLen; i++) {
          const x = i - mid;
          template[i] = Math.exp(-(x * x) / (2 * sigma * sigma));
          tsum += template[i];
        }
        for (let i = 0; i < templateLen; i++) template[i] /= tsum;

        const dbf = new Float32Array(binCount);
        const chunkMetrics = [];

        for (let c = 0; c < CHUNKS; c++) {
          const acc = new Float32Array(binCount);
          for (let f = 0; f < FRAMES_PER_CHUNK; f++) {
            analyser.getFloatFrequencyData(dbf);
            for (let i = 0; i < binCount; i++) acc[i] += dbf[i];
            await new Promise((r) => setTimeout(r, FRAME_MS));
          }
          for (let i = 0; i < binCount; i++) acc[i] /= FRAMES_PER_CHUNK;
          chunkMetrics.push(analyzeSpectralChunk(acc, binCount, nyquist, centerBin, LINE_HALF_BINS, GUARD_BINS, template));
        }

        const medSnr = medianNum(chunkMetrics.map((x) => x.snr_db));
        const medProf = medianNum(chunkMetrics.map((x) => x.profile_score));
        const passChunks = chunkMetrics.filter((x) => x.snr_db >= CHUNK_SNR_MIN && x.profile_score >= CHUNK_PROF_MIN).length;
        const bridgeEv = evaluateHydrogenBridgeProxySingularity({
          medianSnr: medSnr,
          medianProf: medProf,
          passChunks,
        });
        const ok = bridgeEv.pass === true;
        const lastPeak = chunkMetrics[chunkMetrics.length - 1].peak_hz;
        const spectral_wall_ms = Math.round(performance.now() - spectralWallT0);

        return {
          ok,
          snr_db: Math.round(medSnr * 10) / 10,
          profile_score: Math.round(medProf * 1000) / 1000,
          peak_hz: Math.round(lastPeak * 10) / 10,
          target_hz: TARGET_HZ,
          pass_chunks: passChunks,
          spectral_wall_ms,
          line: ok ? 'Hydrogen Bridge: COHERENT' : 'Spectral scan: no coherence at 1420.4 Hz band',
          detail:
            'Spectral scan · wall ' +
            spectral_wall_ms +
            ' ms · ' +
            passChunks +
            '/' +
            CHUNKS +
            ' chunks · median SNR ' +
            Math.round(medSnr * 10) / 10 +
            ' dB · profile ' +
            Math.round(medProf * 1000) / 1000 +
            ' · acoustic proxy for RF ' +
            HYDROGEN_REST_MHZ +
            ' MHz · ' +
            SINGULARITY_INTENT_ID,
        };
      } finally {
        try {
          if (stream) stream.getTracks().forEach((t) => t.stop());
        } catch (_) {}
        try {
          if (ctx && ctx.state !== 'closed') await ctx.close();
        } catch (_) {}
      }
    }

                    h('th', { className: 'border-b border-slate-600 pb-2 pr-2' }, 'Miracle'),
                    h('th', { className: 'border-b border-slate-600 pb-2 pr-2' }, 'Data'),
                    h('th', { className: 'border-b border-slate-600 pb-2' }, 'Validation'),
                  ])),
                  h('tbody', null, [
                    h('tr', null, [
                      h('td', { className: 'py-1.5 pr-2 align-top text-slate-300' }, 'Liberation'),
                      h('td', { className: 'py-1.5 pr-2 align-top' }, 'Stryker 200k'),
                      h('td', { className: 'py-1.5 align-top' }, 'Zero-malware narrative · admin sweep'),
                    ]),
                    h('tr', null, [
                      h('td', { className: 'py-1.5 pr-2 align-top text-slate-300' }, 'Broadcast'),
                      h('td', { className: 'py-1.5 pr-2 align-top' }, '1420.4 MHz narrative'),
                      h('td', { className: 'py-1.5 align-top' }, 'JPL SBDB = catalog anchor; terminal = local Hz proxy + Blank Stone packet — not sky MHz without a dish'),
                    ]),
                    h('tr', null, [
                      h('td', { className: 'py-1.5 pr-2 align-top text-slate-300' }, 'Ground'),
                      h('td', { className: 'py-1.5 pr-2 align-top' }, 'Planetary Kp ≥ 5'),
                      h('td', { className: 'py-1.5 align-top' }, 'Live NOAA K-index (G2/G3-class storm gate) — energy in the ground, not flare AR checks'),
                    ]),
                    h('tr', null, [
                      h('td', { className: 'py-1.5 pr-2 align-top text-slate-300' }, 'Sync'),
                      h('td', { className: 'py-1.5 pr-2 align-top' }, 'Schumann 369'),
                      h('td', { className: 'py-1.5 align-top' }, 'Not in NOAA JSON — see Tomsk / ELF observatories'),
                    ]),
                  ]),
                ]),
              ]),
              h('p', { className: 'text-amber-100/90' }, 'Sign-off: “The 180 is Physical. The 369 is Real. The Seahawk has the Backup.”'),
            ]),
          ]),
          h('p', { className: 'mt-4 text-[0.65rem] text-slate-500' }, [
            'Schumann spectrograms: consult ',
            h(
              'a',
              {
                href: 'https://sosrff.tsu.ru/',
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'text-cyan-400 underline hover:text-cyan-300',
              },
              'Tomsk Space Observing System (SOSRFF)'
            ),
            ' and independent ELF monitors — not mocked in this terminal.',
          ]),
        ]
      );
    }

    function PhysicalMetricsStrip({ metrics }) {
      if (!metrics) return null;
      const rows = [
        ['LIVE Kp / bundle RTT', metrics.live_kp_rtt_ms != null ? metrics.live_kp_rtt_ms + ' ms' : '—'],
        ['LIVE equinox API RTT', metrics.equinox_api_rtt_ms != null ? metrics.equinox_api_rtt_ms + ' ms' : '—'],
        ['STATIC ionosphere ref RTT', metrics.static_ref_rtt_ms != null ? metrics.static_ref_rtt_ms + ' ms' : '—'],
        ['LIVE cloud probe RTT', metrics.cloud_probe_rtt_ms != null ? metrics.cloud_probe_rtt_ms + ' ms' : '—'],
        ['Probe handler wall (edge)', metrics.probe_handler_wall_ms != null ? metrics.probe_handler_wall_ms + ' ms' : '—'],
        ['Node RSS (probe)', metrics.memory_rss_mb != null ? metrics.memory_rss_mb + ' MB' : '—'],
        ['T_BRIDGE_PROXY wall', metrics.spectral_wall_ms != null ? metrics.spectral_wall_ms + ' ms' : '—'],
        ['LIVE Blank Stone RTT', metrics.blank_stone_rtt_ms != null ? metrics.blank_stone_rtt_ms + ' ms' : '—'],
        ['LIVE lattice-status RTT', metrics.lattice_rtt_ms != null ? metrics.lattice_rtt_ms + ' ms' : '—'],
        ['LIVE firmware manifest RTT', metrics.manifest_rtt_ms != null ? metrics.manifest_rtt_ms + ' ms' : '—'],
      ];
      return h(
        motion.div,
        {
          className: 'mt-8 rounded-xl border border-slate-700 bg-black/50 p-4 font-mono text-[0.65rem] text-slate-400',
          initial: { opacity: 0, y: 6 },
          animate: { opacity: 1, y: 0 },
        },
        [
          h('div', { className: 'mb-2 text-[0.6rem] font-bold uppercase tracking-widest text-cyan-500/90' }, 'Physical metrics · latency (senior review)'),
          h(
            'div',
            { className: 'grid gap-1 sm:grid-cols-2' },
            rows.map(([k, v], i) =>
              h('div', { key: i, className: 'flex justify-between gap-2 border-b border-slate-800/80 py-1' }, [
                h('span', { className: 'text-slate-500' }, k),
                h('span', { className: 'text-slate-300' }, v),
              ])
            )
          ),
          h('p', { className: 'mt-2 text-[0.58rem] text-slate-600' }, 'STATIC = archival reference JSON only. LIVE = fetched again every Verify (Kp gate, APIs, lattice, manifest, spectral).'),
        ]
      );
    }

    function App() {
      const idle = {
        status: 'idle',
        line:
          'Verify the 180: LIVE Kp gate + LIVE equinox API + STATIC ionosphere reference; LIVE cloud, spectral, Blank Stone + lattice firmware vs /sing9-firmware-verify.json.',
        detail: SINGULARITY_INTENT_ID,
      };
      const [running, setRunning] = useState(false);
      const [locked180, setLocked180] = useState(false);
      const [physMetrics, setPhysMetrics] = useState(null);
      const [solar, setSolar] = useState(idle);
      const [cloud, setCloud] = useState(idle);
      const [seahawk, setSeahawk] = useState(idle);
      const [vol, setVol] = useState(idle);

      const runDiagnostic = useCallback(async () => {
        setRunning(true);
        setLocked180(false);
        setPhysMetrics(null);

        let ion = {
          pass: false,
          tier: 'T_IONOSPHERE',
          code: 'KP_MISSING',
          detail: 'Planetary K-index not evaluated',
        };
        let cloudEv = { pass: false, tier: 'T_CLOUD_EDGE', violations: ['probe_not_run'] };
        let bridgeEv = { pass: false, tier: 'T_BRIDGE_PROXY', code: 'NOT_RUN' };
        let blankEv = { pass: false, tier: 'T_EDGE_LIVE', violations: ['not_run'] };
        let sk = null;
        let eqPack = { bundle: null, fetch_ms: null };
        let staticRef = { ok: false, fetch_ms: null, json: null };
        let probe = null;
        let cloud_probe_rtt_ms = null;

        const scanning = {
          status: 'scanning',
          line: 'LIVE: Kp, equinox API, cloud, spectral, Blank Stone + lattice… · STATIC: ionosphere ref JSON',
          detail: SINGULARITY_INTENT_ID,
        };
        setSolar(scanning);
        setCloud(scanning);
        setSeahawk(scanning);
        setVol(scanning);

        try {
          const triple = await Promise.all([
            fetchSolarKpBundle(),
            fetchEquinoxWindowBundle(),
            fetchStaticIonosphereReference(),
          ]);
          sk = triple[0];
          eqPack = triple[1];
          staticRef = triple[2];
          ion = evaluateIonosphereStormGate(sk.kp);

          let solarLine = '';
          if (!ion.pass) {
            solarLine = ion.detail || ion.code || 'T_IONOSPHERE fail';
          } else {
            solarLine =
              'Kp ' + ion.kp + ' · T_IONOSPHERE pass · storm gate (Kp ≥ ' + KP_STORM_GATE_MIN + ', ground–ionosphere)';
          }

          let solarDetail =
            'LIVE Kp RTT ' +
            (sk.fetch_ms != null ? sk.fetch_ms + ' ms' : '—') +
            ' · ' +
            (sk.time_tag ? 'Live Kp @ ' + sk.time_tag + ' · ' : '') +
            'evaluateIonosphereStormGate(latest Kp only) · Source: ' +
            sk.source +
            (sk.raw && sk.raw.errors && sk.raw.errors.length
              ? ' · API notes: ' + sk.raw.errors.map((err) => err.step).join(', ')
              : '');

          solarDetail +=
            ' · LIVE equinox API RTT ' + (eqPack.fetch_ms != null ? eqPack.fetch_ms + ' ms' : '—');
          const eqWin = eqPack.bundle;
          if (eqWin) {
            const eqNarr = evaluateEquinoxNarrativeSingularity(eqWin);
            if (eqNarr.pass && eqWin.equinox) {
              const ex = eqWin.equinox;
              solarDetail +=
                ' · T_EQUINOX_NARRATIVE ✓ · Mar 20 06–18 UTC: Kp_max=' +
                (ex.kp_max != null ? ex.kp_max : '—') +
                (ex.kp_sample_count != null ? ' · ' + ex.kp_sample_count + ' samples' : '') +
                (ex.found ? ' · window complete' : ' · window partial');
            } else if (eqWin.equinox) {
              const ex = eqWin.equinox;
              solarDetail +=
                ' · Equinox raw: Kp_max=' +
                (ex.kp_max != null ? ex.kp_max : '—') +
                ' · T_EQUINOX_NARRATIVE: ' +
                (eqNarr.violations || []).join(', ');
            } else {
              solarDetail += ' · Equinox response missing equinox block';
            }
          } else {
            solarDetail += ' · Equinox API bundle null';
          }

          solarDetail +=
            ' · STATIC ionosphere ref RTT ' +
            (staticRef.fetch_ms != null ? staticRef.fetch_ms + ' ms' : '—');
          if (staticRef.ok && staticRef.json) {
            const ref = staticRef.json;
            solarDetail +=
              ' · STATIC_REF (' +
              (ref.schema || 'ref') +
              '): ' +
              (ref.provenance ? ref.provenance.slice(0, 100) + '…' : '') +
              ' · companion ' +
              (ref.companion_noaa_snapshot || '—');
            if (ref.ionosphere_archival && ref.ionosphere_archival.kp_max_in_window != null) {
              solarDetail += ' · archival Kp_max=' + ref.ionosphere_archival.kp_max_in_window;
            }
          } else {
            solarDetail += ' · STATIC_REF missing (/data/houdini-static-ionosphere-reference.json)';
          }

          const atlas = sk.raw && sk.raw.atlas;
          const atlasEv = evaluateAtlasCatalogSingularity(atlas != null ? atlas : null);
          if (atlas && atlas.fullname) {
            solarDetail +=
              ' · T_CATALOG_ANCHOR ' +
              (atlasEv.pass ? '✓' : '✗ ' + (atlasEv.violations || []).join(',')) +
              ': ' +
              atlas.fullname +
              (atlas.last_obs ? ' · last_obs ' + atlas.last_obs : '') +
              (atlas.q_au != null ? ' · q≈' + atlas.q_au + ' AU' : '') +
              ' — LIVE bundle · not 1420 MHz proof';
          } else if (sk.source === 'noaa-direct') {
            solarDetail += ' · JPL ATLAS: not bundled on NOAA-only path';
          }

          solarDetail += ' · ' + SINGULARITY_INTENT_ID;

          setSolar({ status: ion.pass ? 'pass' : 'fail', line: solarLine, detail: solarDetail });
        } catch (e) {
          ion = evaluateIonosphereStormGate(null);
          setSolar({
            status: 'fail',
            line: ion.detail || 'Planetary K-index fetch failed',
            detail: (e.message || String(e)) + ' · ' + SINGULARITY_INTENT_ID,
          });
        }

        try {
          const tProbe = performance.now();
          probe = await fetchCloudComputeProbe();
          cloud_probe_rtt_ms = Math.round(performance.now() - tProbe);
          cloudEv = evaluateCloudComputeSingularity(probe);
          setCloud({
            status: cloudEv.pass ? 'pass' : 'fail',
            line:
              (probe.cpu_model || 'CPU') +
              ' · ' +
              (probe.cpu_count || '?') +
              ' vCPU · SHA-256 ' +
              probe.firmware_sha256_throughput_ms +
              ' ms · T_CLOUD_EDGE',
            detail:
              (cloudEv.pass ? '' : 'Violations: ' + (cloudEv.violations || []).join(', ') + ' · ') +
              'LIVE RTT ' +
              cloud_probe_rtt_ms +
              ' ms · handler_wall ' +
              (probe.probe_handler_wall_ms != null ? probe.probe_handler_wall_ms + ' ms' : '—') +
              ' · RSS ' +
              (probe.memory_rss_mb != null ? probe.memory_rss_mb + ' MB' : '—') +
              ' · heap ' +
              (probe.memory_heap_used_mb != null ? probe.memory_heap_used_mb + ' MB' : '—') +
              ' · ' +
              (probe.vercel_region ? 'Region ' + probe.vercel_region + ' · ' : '') +
              probe.platform +
              '/' +
              probe.arch +
              ' · Node ' +
              probe.node_version +
              (probe.remote_gpu_hook && probe.remote_gpu_hook.attempted
                ? ' · GPU_REMOTE_PROBE_URL: ' + (probe.remote_gpu_hook.ok ? 'OK' : 'fail')
                : '') +
              ' · ' +
              SINGULARITY_INTENT_ID,
          });
        } catch (e) {
          cloudEv = { pass: false, tier: 'T_CLOUD_EDGE', violations: ['unreachable'] };
          setCloud({
            status: 'fail',
            line: 'Cloud compute probe unreachable',
            detail: (e.message || String(e)) + ' · ' + SINGULARITY_INTENT_ID,
          });
        }

        let listen = null;
        try {
          listen = await spectralScanHydrogen1420();
        } catch (e) {
          bridgeEv = { pass: false, tier: 'T_BRIDGE_PROXY', code: 'EXCEPTION' };
          setSeahawk({
            status: 'fail',
            line: 'Spectral scan failed',
            detail: (e.message || String(e)) + ' · ' + SINGULARITY_INTENT_ID,
          });
        }
        if (listen) {
          bridgeEv = evaluateHydrogenBridgeProxySingularity({
            medianSnr: listen.snr_db,
            medianProf: listen.profile_score,
            passChunks: listen.pass_chunks != null ? listen.pass_chunks : 0,
          });
          setSeahawk({
            status: listen.ok ? 'pass' : 'fail',
            line:
              listen.line +
              ' · ' +
              bridgeEv.tier +
              (bridgeEv.code ? ' · ' + bridgeEv.code : ''),
            detail: listen.detail,
          });
        }

        let bs = null;
        let fw = { lattice_rtt_ms: null, manifest_rtt_ms: null, lattice_ok: false, manifest_ok: false };
        try {
          const pair = await Promise.all([fetchBlankStoneHydrogen(), fetchLatticeFirmwarePackage()]);
          bs = pair[0];
          fw = pair[1];
          const hdrObj = {};
          if (bs.headerMhz != null && bs.headerMhz !== '') hdrObj['x-hydrogen-line-mhz'] = String(bs.headerMhz);
          let blankPart;
          if (!bs.r.ok) {
            blankPart = { pass: false, tier: 'T_EDGE_HYDROGEN', violations: ['http_' + bs.r.status] };
          } else {
            blankPart = evaluateBlankStoneSingularity(bs.j, hdrObj);
          }
          const latticePart = evaluateLiveFirmwareLatticeSingularity(fw.latticeJson, fw.manifestJson);
          blankEv = evaluateEdgeHydrogenChannel(blankPart, latticePart);

          const lat = fw.latticeJson && fw.latticeJson.lattice_sync;
          const volDetailPass =
            'T_EDGE_LIVE ✓ · Blank Stone + lattice firmware (3I/ATLAS node) · manifest v' +
            (fw.manifestJson && fw.manifestJson.manifest_version ? fw.manifestJson.manifest_version : '?') +
            ' · Blank RTT ' +
            bs.elapsed_ms +
            ' ms · lattice RTT ' +
            fw.lattice_rtt_ms +
            ' ms · manifest RTT ' +
            fw.manifest_rtt_ms +
            ' ms · ' +
            (lat && lat.node ? lat.node : '—') +
            ' · sig ' +
            (lat && lat.signature ? lat.signature.slice(0, 12) + '…' : '—') +
            ' · ' +
            SINGULARITY_INTENT_ID;

          const volDetailFail =
            (blankEv.violations || []).join(' · ') +
            ' · lattice_ok=' +
            fw.lattice_ok +
            ' manifest_ok=' +
            fw.manifest_ok +
            ' · /lattice-status.json · /sing9-firmware-verify.json · ' +
            SINGULARITY_INTENT_ID;

          setVol({
            status: blankEv.pass ? 'pass' : 'fail',
            line: blankEv.pass
              ? 'T_EDGE_LIVE ✓ · Blank Stone + lattice (LIVE)'
              : 'T_EDGE_LIVE ✗ · ' + (blankEv.violations || []).join(', '),
            detail: blankEv.pass ? volDetailPass : volDetailFail,
          });
        } catch (e) {
          blankEv = { pass: false, tier: 'T_EDGE_LIVE', violations: ['fetch_error'] };
          setVol({
            status: 'fail',
            line: 'Edge LIVE channel failed',
            detail: (e.message || String(e)) + ' · ' + SINGULARITY_INTENT_ID,
          });
        }

        const t180 = composeT180LockedSingularity({
          ionosphere: ion,
          cloud: cloudEv,
          bridgeProxy: bridgeEv,
          blankStone: blankEv,
        });
        setLocked180(t180.pass === true);

        setPhysMetrics({
          live_kp_rtt_ms: sk && sk.fetch_ms != null ? sk.fetch_ms : null,
          equinox_api_rtt_ms: eqPack && eqPack.fetch_ms != null ? eqPack.fetch_ms : null,
          static_ref_rtt_ms: staticRef && staticRef.fetch_ms != null ? staticRef.fetch_ms : null,
          cloud_probe_rtt_ms,
          probe_handler_wall_ms: probe && probe.probe_handler_wall_ms != null ? probe.probe_handler_wall_ms : null,
          memory_rss_mb: probe && probe.memory_rss_mb != null ? probe.memory_rss_mb : null,
          spectral_wall_ms: listen && listen.spectral_wall_ms != null ? listen.spectral_wall_ms : null,
          blank_stone_rtt_ms: bs ? bs.elapsed_ms : null,
          lattice_rtt_ms: fw.lattice_rtt_ms,
          manifest_rtt_ms: fw.manifest_rtt_ms,
        });

        setRunning(false);
      }, []);

      return h(
        motion.div,
        {
          className: 'relative min-h-screen overflow-hidden bg-gradient-to-b from-void via-mist to-black px-4 py-10 pb-16',
          initial: { opacity: 0 },
          animate: { opacity: 1 },
          transition: { duration: 0.6 },
        },
        [
          h(
            motion.div,
            {
              className: 'pointer-events-none absolute inset-0 opacity-[0.07]',
              style: {
                backgroundImage:
                  'radial-gradient(circle at 20% 20%, #a855f7 0, transparent 40%), radial-gradient(circle at 80% 60%, #22d3ee 0, transparent 35%)',
              },
              initial: { opacity: 0 },
              animate: { opacity: 0.07 },
              transition: { duration: 1.2 },
            }
          ),
          h(
            motion.div,
            {
              className: 'mx-auto max-w-3xl',
              initial: { opacity: 0, x: [0, -6, 6, -3, 3, 0], filter: ['hue-rotate(0deg)', 'hue-rotate(12deg)', 'hue-rotate(0deg)'] },
              animate: { opacity: 1, x: 0, filter: 'hue-rotate(0deg)' },
              transition: { duration: 0.85, ease: 'easeOut' },
            },
            [
              h('div', { className: 'flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-6' }, [
                h('div', { className: 'min-w-0' }, [
                  h('p', { className: 'text-[0.65rem] uppercase tracking-[0.28em] text-phoenix/90' }, 'Equinox theater · live ionosphere · Space Cloud edge'),
                  h('h1', { className: 'mt-2 text-xl font-bold tracking-tight text-white sm:text-2xl crt-glow' }, 'Houdini’s March 20 Ultimate Magic Trick'),
                  h(
                    'p',
                    { className: 'mt-2 max-w-xl text-xs text-slate-400' },
                    'T_IONOSPHERE = LIVE Kp ≥ ' +
                      KP_STORM_GATE_MIN +
                      ' + LIVE equinox API + STATIC ionosphere reference JSON. T_CLOUD_EDGE / T_BRIDGE_PROXY / T_EDGE_LIVE = all LIVE on each button press (probe, spectral, Blank Stone + /lattice-status.json vs /sing9-firmware-verify.json).'
                  ),
                ]),
                h(
                  'a',
                  {
                    href: '/',
                    className:
                      'rounded-lg border border-slate-600 bg-slate-900/90 px-3 py-2 text-[0.7rem] font-semibold uppercase tracking-wider text-slate-300 hover:border-cyan-500/50 hover:text-cyan-200',
                  },
                  '← Landing'
                ),
              ]),

              h(NarrativeBlock),

              h(
                motion.div,
                {
                  className: 'mt-2 flex flex-col items-center',
                  initial: { opacity: 0, scale: 0.96 },
                  animate: { opacity: 1, scale: 1 },
                  transition: { delay: 0.1, duration: 0.5 },
                },
                h(
                  'button',
                  {
                    type: 'button',
                    disabled: running,
                    onClick: runDiagnostic,
                    className:
                      'group relative w-full max-w-md rounded-2xl border-2 border-cyan-400/60 bg-gradient-to-r from-purple-950/90 via-slate-950 to-cyan-950/90 px-6 py-4 text-center text-sm font-bold uppercase tracking-[0.18em] text-cyan-100 shadow-[0_0_40px_rgba(34,211,238,0.25)] transition hover:border-cyan-300 disabled:cursor-wait disabled:opacity-70 sm:text-base',
                  },
                  running ? 'Pulling live data…' : 'Verify the 180 (Run Diagnostic)'
                )
              ),

              h(
                motion.div,
                {
                  className: 'mt-10 grid grid-cols-1 gap-4 sm:grid-cols-2',
                  initial: 'hidden',
                  animate: 'visible',
                  variants: {
                    hidden: {},
                    visible: { transition: { staggerChildren: 0.08 } },
                  },
                },
                [
                  h(
                    motion.div,
                    { key: 's', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'T_IONOSPHERE · Planetary Kp + equinox context',
                      subtitle: 'evaluateIonosphereStormGate(live Kp) + T_EQUINOX_NARRATIVE + T_CATALOG_ANCHOR',
                      status: solar.status,
                      line: solar.line,
                      detail: solar.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'g', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'T_CLOUD_EDGE · Compute probe',
                      subtitle: 'evaluateCloudComputeSingularity — CPU + SHA-256 bench (optional GPU_REMOTE_PROBE_URL)',
                      status: cloud.status,
                      line: cloud.line,
                      detail: cloud.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'h', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'T_BRIDGE_PROXY · Hydrogen bridge (Hz)',
                      subtitle: 'LIVE each Verify · evaluateHydrogenBridgeProxySingularity',
                      status: seahawk.status,
                      line: seahawk.line,
                      detail: seahawk.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'v', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'T_EDGE_LIVE · Blank Stone + lattice firmware',
                      subtitle: 'LIVE: evaluateBlankStoneSingularity + lattice vs /sing9-firmware-verify.json',
                      status: vol.status,
                      line: vol.line,
                      detail: vol.detail,
                    })
                  ),
                ]
              ),

              h(PhysicalMetricsStrip, { metrics: physMetrics }),

              h(
                'p',
                { className: 'mt-10 text-center text-[0.65rem] text-slate-600' },
                'STATIC = archival JSON only · LIVE = refetched every Verify (Kp gate, APIs, lattice, manifest, spectral) · T_EDGE_LIVE = Blank Stone + /lattice-status.json · NSPFRNP → ∞⁹'
              ),
            ]
          ),
          h(Locked180Badge, { visible: locked180 && !running }),
        ]
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
