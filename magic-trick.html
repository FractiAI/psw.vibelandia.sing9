    const HYDROGEN_REST_MHZ = 1420.405751;

    function findAr4392(regions) {
      if (!Array.isArray(regions)) return null;
      return regions.find((r) => Number(r.region) === 4392 || String(r.region) === '4392') || null;
    }

    function latestRtsw(rows) {
      if (!Array.isArray(rows) || rows.length === 0) return null;
      for (let i = rows.length - 1; i >= 0; i--) {
        const r = rows[i];
        if (r && (r.active === true || r.active === 'true') && typeof r.bt === 'number') {
          return { time_tag: r.time_tag, source: r.source || 'RTSW', bt_nT: r.bt };
        }
      }
      const last = rows[rows.length - 1];
      if (!last || typeof last.bt !== 'number') return null;
      return { time_tag: last.time_tag, source: last.source || 'RTSW', bt_nT: last.bt };
    }

    async function fetchLiveReadingsDirect() {
      const out = {
        fetched_at_utc: new Date().toISOString(),
        kp: null,
        ar4392: null,
        rtsw: null,
        atlas: null,
        errors: [],
      };
      const safe = async (label, fn) => {
        try {
          await fn();
        } catch (e) {
          out.errors.push({ step: label, message: e.message || String(e) });
        }
      };

      await safe('noaa_planetary_k', async () => {
        const r = await fetch('https://services.swpc.noaa.gov/json/planetary_k_index_1m.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        if (!Array.isArray(data) || !data.length) throw new Error('empty Kp array');
        const last = data[data.length - 1];
        const raw = last.kp_index ?? last.estimated_kp ?? last.Kp;
        const kp = typeof raw === 'string' ? parseFloat(raw) : Number(raw);
        out.kp = { kp: Number.isFinite(kp) ? kp : null, time_tag: last.time_tag || null };
        if (out.kp.kp == null) throw new Error('unparsed Kp');
      });

      await safe('noaa_solar_regions', async () => {
        const r = await fetch('https://services.swpc.noaa.gov/json/solar_regions.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        out.ar4392 = findAr4392(data);
      });

      await safe('noaa_rtsw_mag', async () => {
        const r = await fetch('https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json', { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const row = latestRtsw(data);
        if (!row) throw new Error('no RTSW Bt');
        out.rtsw = row;
      });

      await safe('jpl_sbdb_atlas', async () => {
        const r = await fetch(
          'https://ssd-api.jpl.nasa.gov/sbdb.api?sstr=' + encodeURIComponent('C/2025 N1') + '&cad=1',
          { cache: 'no-store' }
        );
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        const obj = data.object || {};
        const orb = data.orbit || {};
        const qEl = Array.isArray(orb.elements) ? orb.elements.find((e) => e.name === 'q') : null;
        out.atlas = {
          fullname: obj.fullname || null,
          spkid: obj.spkid || null,
          last_obs: orb.last_obs || null,
          q_au: qEl ? qEl.value : null,
        };
        if (!out.atlas.fullname) throw new Error('missing JPL designation');
      });

      return out;
    }

    async function fetchLiveReadings() {
      try {
        const r = await fetch('/api/live-houdini-readings', { cache: 'no-store' });
        if (r.ok) return await r.json();
      } catch (_) {}
      return fetchLiveReadingsDirect();
    }

    async function verifyLatticeFromOrigin() {
      const url = new URL('/lattice-status.json', window.location.origin).href;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('lattice-status.json HTTP ' + res.status);
      const text = await res.text();
      const json = JSON.parse(text);
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      const sig = json.lattice_sync && json.lattice_sync.signature;
      const freq = json.constants && json.constants.hydrogen_line_mhz;
      return {
        url,
        sha256_prefix: hex.slice(0, 32),
        signature: typeof sig === 'string' ? sig : null,
        hydrogen_line_mhz: freq != null ? freq : null,
        ok:
          typeof sig === 'string' &&
          sig.length >= 16 &&
          json.lattice_sync &&
          json.lattice_sync.frequency_mhz != null,
      };
    }

    function detectGpu() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return { vendor: 'unknown', renderer: 'no-webgl', isNvidia: false, isIntel: false };
        const ext = gl.getExtension('WEBGL_debug_renderer_info');
        const vendor = ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) || '' : '';
        const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '' : '';
        const r = (renderer + ' ' + vendor).toLowerCase();
        return {
          vendor,
          renderer,
          isNvidia: r.includes('nvidia') || r.includes('geforce') || r.includes('rtx'),
          isIntel: r.includes('intel'),
        };
      } catch {
        return { vendor: '', renderer: 'error', isNvidia: false, isIntel: false };
      }
    }

    function sovereignLatencyMs() {
      const t0 = performance.now();
      let x = 0;
      for (let i = 0; i < 24; i++) x += Math.sin(i) * Math.cos(i ^ 13);
      return performance.now() - t0;
    }

    function App() {
      const idle = { status: 'idle', line: 'Run diagnostic for live NOAA / NASA / lattice reads.', detail: '' };
      const [running, setRunning] = useState(false);
      const [solar, setSolar] = useState(idle);
      const [gpu, setGpu] = useState(idle);
      const [seahawk, setSeahawk] = useState(idle);
      const [vol, setVol] = useState(idle);

      const runDiagnostic = useCallback(async () => {
        setRunning(true);
        const scanning = { status: 'scanning', line: 'Fetching live upstreams…', detail: '' };
        setSolar(scanning);
        setGpu(scanning);
        setSeahawk(scanning);
        setVol(scanning);

        const live = await fetchLiveReadings();

        const kpVal = live.kp && live.kp.kp;
        const kpOk = kpVal != null && Number.isFinite(kpVal);
        const g2 = kpOk && kpVal > 5;
        const ar = live.ar4392;
        const rtsw = live.rtsw;
        const solarPass = kpOk && g2 && ar != null && rtsw != null;

        let solarLine = '';
        if (!kpOk) solarLine = 'K-index: unavailable (NOAA fetch/parse failed)';
        else if (!g2) solarLine = 'Kp ' + kpVal + ' — below G2 gate (need Kp > 5)';
        else solarLine = 'Kp ' + kpVal + ' — G2+ window (live)';

        let solarDetail =
          (live.kp && live.kp.time_tag ? 'Kp time_tag: ' + live.kp.time_tag + ' · ' : '') +
          (ar ? 'AR4392 in NOAA solar_regions · ' : 'AR4392 not in current NOAA solar_regions · ') +
          (rtsw ? 'IMF Bt ' + rtsw.bt_nT + ' nT · ' + rtsw.source + ' @ ' + rtsw.time_tag : 'RTSW IMF unavailable');
        if (live.errors && live.errors.length) {
          solarDetail += ' · errors: ' + live.errors.map((e) => e.step).join(', ');
        }

        setSolar({
          status: solarPass ? 'pass' : 'fail',
          line: solarLine,
          detail: solarDetail,
        });

        const g = detectGpu();
        const lat = sovereignLatencyMs();
        const sovereign = (g.isNvidia || g.isIntel) && lat < 1;
        setGpu({
          status: sovereign ? 'pass' : 'fail',
          line: sovereign
            ? 'Sovereign render path · ' + lat.toFixed(3) + ' ms (< 1 ms)'
            : 'Measured ' + lat.toFixed(3) + ' ms · ' + (g.isNvidia || g.isIntel ? '≥ 1 ms gate' : 'not NVIDIA/Intel'),
          detail: g.renderer || 'No WEBGL_debug_renderer_info',
        });

        const atl = live.atlas;
        const atlasOk = atl && atl.fullname;
        const jplErr =
          live.errors && live.errors.filter((e) => e.step === 'jpl_sbdb_atlas').map((e) => e.message).join(' · ');
        setSeahawk({
          status: atlasOk ? 'pass' : 'fail',
          line: atlasOk
            ? atl.fullname + ' · q≈' + (atl.q_au != null ? atl.q_au : '?') + ' au · last_obs ' + (atl.last_obs || '—')
            : 'JPL SBDB live read failed or incomplete',
          detail: atlasOk
            ? 'Rest H I line: ' + HYDROGEN_REST_MHZ + ' MHz (CODATA). Ephemeris: NASA/JPL SBDB. No simulated RF ping.'
            : (jplErr || 'Check network / CORS / NASA JPL availability'),
        });

        try {
          const L = await verifyLatticeFromOrigin();
          setVol({
            status: L.ok ? 'pass' : 'fail',
            line: L.ok
              ? 'Lattice manifest OK · SHA-256 ' + L.sha256_prefix + '…'
              : 'Lattice JSON or lattice_sync.signature failed checks',
            detail:
              'GET ' +
              L.url +
              ' · sig ' +
              (L.signature ? L.signature.slice(0, 24) + '…' : 'missing') +
              (L.hydrogen_line_mhz != null ? ' · hydrogen_line_mhz ' + L.hydrogen_line_mhz : ''),
          });
        } catch (e) {
          setVol({
            status: 'fail',
            line: 'lattice-status.json unreachable',
            detail: e.message || String(e),
          });
        }

        setRunning(false);
      }, []);
