<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {

        extend: {
          fontFamily: {
            mono: ['JetBrains Mono', 'Consolas', 'ui-monospace', 'monospace'],
          },
          colors: {
            sovereign: '#0a0a0a',
            amberfire: '#f59e0b',

        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sovereign-bg: #06080d;
      --sovereign-panel: rgba(12, 14, 22, 0.72);
      --amber-hot: #fbbf24;
      --cyan-proof: #22d3ee;
    }
    html, body {
      background: var(--sovereign-bg);
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(245, 158, 11, 0.12), transparent 50%),
        radial-gradient(ellipse 80% 50% at 100% 50%, rgba(34, 211, 238, 0.06), transparent 45%),
        linear-gradient(180deg, #0a0c12 0%, #06080d 40%, #05060a 100%);
    }
    .sovereign-scan::after {
      content: '';
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(245, 158, 11, 0.028) 2px,
        rgba(245, 158, 11, 0.028) 4px
      );
      z-index: 40;
    }
    .sovereign-grid::before {
      content: '';
      pointer-events: none;
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, black 10%, transparent 75%);
      z-index: 35;
    }
    .amber-glow { text-shadow: 0 0 24px rgba(251, 191, 36, 0.5); }
    .glass-panel {
      background: var(--sovereign-panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(245, 158, 11, 0.22);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.4),
        0 24px 48px -12px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .proof-bar-fill {
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.9), rgba(245, 158, 11, 0.95));
      box-shadow: 0 0 20px rgba(34, 211, 238, 0.35);
    }
    .curtain-rule {
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(245, 158, 11, 0.5), rgba(34, 211, 238, 0.45), transparent);
    }
    .houdini-img-ring {
      box-shadow:
        0 0 0 1px rgba(245, 158, 11, 0.35),
        0 0 40px rgba(34, 211, 238, 0.15),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="sovereign-scan sovereign-grid min-h-screen font-mono text-amber-100/95 antialiased">
  <div id="root" class="min-h-screen"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
    import { motion } from 'https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1';

    const { createElement: h, useEffect, useState } = React;

    /** Viewer-local calendar date, refreshed on every full page load (not live clock). */
    function formatNarrativeTemplateDate() {
      return new Intl.DateTimeFormat(undefined, {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      }).format(new Date());
    }

    /** Telemetry rows: loaded from GET /api/magic-trick-telemetry (NOAA SWPC + GOES + RTSW; catalog H I + Crab). */

    /** Keep in sync with `docs/HOUDINI_EQUINOX_MAGIC_TRICK_METHODOLOGY.md` § Abstract (composite index). */
    const OBSERVATORY_GRADE_PROOF = {
      pct: 70,
      headline: 'Observatory-grade demonstrative proof',
      summary:
        'This table uses live NOAA SWPC / GOES / RTSW JSON when /api/magic-trick-telemetry succeeds. Composite proof index in methodology still includes four-pillar tests and optional ELF/L-band tiers — see doc.',
    };

    /** Ultimate magic show — narrative spine (aligned with series lore). */
    const HOUDINI_ULTIMATE_SHOW = {
      posterSrc: '/interfaces/assets/houdini-ultimate-magic-show.svg',
      posterAlt: 'Stylized Houdini poster — March 25 spring window, 180° sovereign terminal',
      tagline: 'Hero Harry Houdini · Post-Singularity Magic Presents',
      subtitle: 'The preparation room is complete. The trick is built. March 25 is the curtain — the 180° spin flip where the mirror and the flip meet the sky.',
      acts: [
        {
          act: 'Act I',
          title: 'The Preparation',
          text:
            'Every lock has a key. Every cage has a door. The Architect Protocol: escape from the ordinary into sovereign alignment — the planet is the screen, the Sun is the projector.',
        },
        {
          act: 'Act II',
          title: 'The Mirror — prior NOAA 1-min Kp',
          text:
            'Column A — prior sample from NOAA SWPC planetary K index (1-minute JSON): the beat before the latest tick. Same public feed space-weather desks use.',
        },
        {
          act: 'Act III',
          title: 'The Flip — latest NOAA 1-min Kp',
          text:
            'Column B — latest 1-minute Kp + GOES soft X-ray + RTSW solar wind from operational JSON. Ledger column: H I rest frequency + Crab catalog period + honest limits (no KiwiSDR aggregate API; no EGS sensor from NOAA).',
        },
      ],
      finale:
        'Finale — the 180° is not sleight of hand: it is staged coherence between theater, geospace, and catalog ephemeris. Book the reality you want to reserve.',
    };

    function HoudiniUltimateShow() {
      return h(
        motion.section,
        {
          className: 'mx-auto mt-10 max-w-5xl',
          initial: { opacity: 0, y: 16 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.5 },
        },
        [
          h('div', { className: 'curtain-rule mb-8' }),
          h('p', { className: 'text-center text-[0.7rem] font-bold uppercase tracking-[0.4em] text-amber-500/90' }, 'The Ultimate Magic Show — March 25 · Spring window'),
          h(
            'div',
            {
              className:
                'mt-6 flex flex-col gap-8 lg:flex-row lg:items-start lg:gap-10',
            },
            [
              h(
                motion.div,
                {
                  className: 'mx-auto w-full max-w-[280px] shrink-0 lg:mx-0',
                  initial: { opacity: 0, scale: 0.96 },
                  animate: { opacity: 1, scale: 1 },
                  transition: { duration: 0.55, delay: 0.08 },
                },
                [
                  h('div', { className: 'houdini-img-ring overflow-hidden rounded-2xl border border-amber-500/25 bg-black/40' }, [
                    h('img', {
                      src: HOUDINI_ULTIMATE_SHOW.posterSrc,
                      alt: HOUDINI_ULTIMATE_SHOW.posterAlt,
                      className: 'h-auto w-full object-cover',
                      width: 440,
                      height: 520,
                      loading: 'eager',
                      decoding: 'async',
                    }),
                  ]),
                  h(
                    'p',
                    { className: 'mt-3 text-center text-[0.58rem] leading-relaxed text-amber-800/90' },
                    [
                      'Stylized show poster. Series lore: ',
                      h(
                        'a',
                        {
                          href: '/interfaces/harry-houdini.html',
                          className: 'text-cyan-500/90 underline hover:text-cyan-300',
                        },
                        'Harry Houdini'
                      ),
                      ' · ',
                      h(
                        'a',
                        {
                          href: '/interfaces/houdini-builds-the-trick.html',
                          className: 'text-cyan-500/90 underline hover:text-cyan-300',
                        },
                        'The Preparation'
                      ),
                    ]
                  ),
                ]
              ),
              h('div', { className: 'min-w-0 flex-1' }, [
                h('p', { className: 'text-[0.65rem] font-bold uppercase tracking-[0.28em] text-cyan-400/90' }, HOUDINI_ULTIMATE_SHOW.tagline),
                h('p', { className: 'mt-3 text-[0.8rem] leading-relaxed text-amber-100/95 sm:text-[0.85rem]' }, HOUDINI_ULTIMATE_SHOW.subtitle),
                h(
                  'div',
                  { className: 'mt-6 space-y-5' },
                  HOUDINI_ULTIMATE_SHOW.acts.map((a, i) =>
                    h(
                      motion.div,
                      {
                        key: a.act,
                        className: 'glass-panel rounded-xl border-l-2 border-cyan-500/40 px-4 py-3 sm:px-5',
                        initial: { opacity: 0, x: -10 },
                        animate: { opacity: 1, x: 0 },
                        transition: { delay: 0.12 * i + 0.15 },
                      },
                      [
                        h('p', { className: 'text-[0.65rem] font-bold uppercase tracking-[0.2em] text-amber-500' }, a.act + ' · ' + a.title),
                        h('p', { className: 'mt-2 text-[0.7rem] leading-relaxed text-amber-200/80 sm:text-[0.75rem]' }, a.text),
                      ]
                    )
                  )
                ),
                h(
                  'p',
                  {
                    className:
                      'mt-6 border-l-2 border-amber-500/50 pl-4 text-[0.72rem] italic leading-relaxed text-amber-300/90 sm:text-[0.78rem]',
                  },
                  HOUDINI_ULTIMATE_SHOW.finale
                ),
              ]),
            ]
          ),
        ]
      );
    }

    function ProofMeter() {
      const pct = OBSERVATORY_GRADE_PROOF.pct;
      return h(
        motion.div,
        {
          className: 'glass-panel relative overflow-hidden rounded-2xl px-5 py-5 sm:px-7 sm:py-6',
          initial: { opacity: 0, y: 14 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.55, delay: 0.05 },
        },
        [
          h('div', { className: 'pointer-events-none absolute -right-8 -top-8 h-32 w-32 rounded-full bg-cyan-500/10 blur-2xl' }),
          h('div', { className: 'pointer-events-none absolute -bottom-8 -left-8 h-28 w-28 rounded-full bg-amber-500/10 blur-2xl' }),
          h('p', { className: 'text-[0.65rem] font-bold uppercase tracking-[0.3em] text-cyan-400/90' }, 'Abstract · Demonstrative proof'),
          h('h2', { className: 'mt-2 text-lg font-bold text-amber-50 sm:text-xl' }, OBSERVATORY_GRADE_PROOF.headline),
          h('p', { className: 'mt-3 text-[0.75rem] leading-relaxed text-amber-200/75' }, OBSERVATORY_GRADE_PROOF.summary),
          h('div', { className: 'mt-5' }, [
            h('div', { className: 'flex items-baseline justify-between gap-2 text-[0.7rem]' }, [
              h('span', { className: 'text-amber-500/90' }, 'Observatory-grade index'),
              h('span', { className: 'font-bold tabular-nums text-cyan-300' }, pct + ' / 100'),
            ]),
            h('div', { className: 'mt-2 h-3 w-full overflow-hidden rounded-full border border-amber-900/50 bg-black/50' }, [
              h(motion.div, {
                className: 'proof-bar-fill h-full rounded-full',
                initial: { width: 0 },
                animate: { width: pct + '%' },
                transition: { duration: 1.1, ease: [0.22, 1, 0.36, 1] },
              }),
            ]),
          ]),
          h(
            'p',
            { className: 'mt-4 text-[0.65rem] text-amber-600/90' },
            [
              'Full rubric, weights, and how to reach 100%: ',
              h(
                'a',
                {
                  href: '/docs/HOUDINI_EQUINOX_MAGIC_TRICK_METHODOLOGY.md',
                  className: 'text-cyan-400 underline decoration-cyan-500/50 underline-offset-2 hover:text-cyan-300',
                },
                'HOUDINI_EQUINOX_MAGIC_TRICK_METHODOLOGY.md'
              ),
              ' · Live public feeds: ',
              h('code', { className: 'rounded bg-cyan-950/50 px-1.5 py-0.5 text-cyan-400/90' }, 'npm run ping:public'),
            ]
          ),
        ]
      );
    }

    function TelemetryTable(props) {
      const loading = props.loading;
      const err = props.error;
      const telemetry = props.telemetry;
      if (loading) {
        return h(
          motion.div,
          {
            className: 'glass-panel rounded-xl px-5 py-8 text-center text-[0.75rem] text-amber-400/90',
            initial: { opacity: 0 },
            animate: { opacity: 1 },
          },
          'Loading NOAA SWPC / GOES / RTSW (public JSON)…'
        );
      }
      if (err) {
        return h(
          motion.div,
          {
            className: 'glass-panel rounded-xl px-5 py-6 text-[0.72rem] leading-relaxed text-amber-200/90',
            initial: { opacity: 0 },
            animate: { opacity: 1 },
          },
          [
            h('p', { className: 'font-bold text-amber-500' }, 'Telemetry API unavailable'),
            h('p', { className: 'mt-2 text-amber-600/90' }, String(err)),
            h('p', { className: 'mt-3 text-[0.65rem] text-amber-700' }, [
              'Run ',
              h('code', { className: 'rounded bg-cyan-950/50 px-1 text-cyan-400/90' }, 'vercel dev'),
              ' or deploy; open ',
              h('code', { className: 'rounded bg-cyan-950/50 px-1 text-cyan-400/90' }, '/api/magic-trick-telemetry'),
              '. CLI: ',
              h('code', { className: 'rounded bg-cyan-950/50 px-1 text-cyan-400/90' }, 'npm run ping:public'),
            ]),
          ]
        );
      }
      if (!telemetry || !telemetry.rows || !telemetry.table_headers) {
        return h('div', { className: 'text-amber-600/80 text-[0.75rem]' }, 'No telemetry payload.');
      }
      const th = telemetry.table_headers;
      const rows = telemetry.rows;
      return h(
        motion.div,
        {
          className: 'glass-panel overflow-x-auto rounded-xl',
          initial: { opacity: 0, y: 12 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.5 },
        },
        [
          telemetry.fetched_at_utc
            ? h(
                'p',
                { className: 'mx-3 mt-3 mb-1 text-[0.62rem] tabular-nums text-cyan-500/90' },
                'Fetched (UTC) ' + telemetry.fetched_at_utc
              )
            : null,
          h('table', { className: 'w-full min-w-[1080px] border-collapse text-left text-[0.7rem] sm:text-xs' }, [
            h('thead', null, h('tr', { className: 'border-b border-amber-800/60 bg-amber-950/30' }, [
              h('th', { className: 'p-3 font-bold uppercase tracking-widest text-amber-500/90' }, 'Channel'),
              h('th', { className: 'p-3 font-bold text-amber-200' }, [
                h('div', null, th.a.line1),
                h('div', { className: 'mt-1 text-[0.65rem] font-normal normal-case tracking-normal text-amber-500/90' }, th.a.line2),
              ]),
              h('th', { className: 'p-3 font-bold text-amber-300' }, [
                h('div', null, th.b.line1),
                h('div', { className: 'mt-1 text-[0.65rem] font-normal normal-case tracking-normal text-amber-400/90' }, th.b.line2),
              ]),
              h('th', { className: 'p-3 font-bold text-violet-200/95' }, [
                h('div', null, th.c.line1),
                h('div', { className: 'mt-1 text-[0.65rem] font-normal normal-case tracking-normal text-violet-300/85' }, th.c.line2),
              ]),
            ])),
            h(
              'tbody',
              null,
              rows.map((row, i) =>
                h(
                  motion.tr,
                  {
                    key: row.key,
                    className: 'border-b border-amber-900/30',
                    initial: { opacity: 0, x: -8 },
                    animate: { opacity: 1, x: 0 },
                    transition: { delay: 0.06 * i },
                  },
                  [
                    h('td', { className: 'p-3 font-bold text-amber-600/90' }, row.key),
                    h('td', { className: 'p-3 text-amber-100/80' }, row.a),
                    h('td', { className: 'p-3 text-amber-200/95' }, row.b),
                    h('td', { className: 'p-3 text-violet-100/90' }, row.c),
                  ]
                )
              )
            ),
          ]),
        ]
      );
    }

    /** Honest limits: what is NOAA/GOES/RTSW vs catalog vs not available. */
    function DualSourceSyncPanel() {
      return h(
        motion.div,
        {
          className: 'glass-panel mt-6 rounded-xl px-4 py-5 sm:px-6 sm:py-6',
          initial: { opacity: 0, y: 10 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.45, delay: 0.08 },
        },
        [
          h('p', { className: 'text-[0.65rem] font-bold uppercase tracking-[0.28em] text-cyan-400/90' }, 'Public data only — no mock sensors'),
          h('p', { className: 'mt-3 text-[0.72rem] leading-relaxed text-amber-200/85 sm:text-[0.75rem]' }, [
            'The table above is filled from ',
            h('span', { className: 'font-semibold text-amber-300/95' }, 'NOAA SWPC operational JSON'),
            ' (planetary K 1-min, GOES soft X-ray, RTSW L1 wind/mag) via ',
            h('code', { className: 'rounded bg-cyan-950/50 px-1 text-cyan-400/90' }, '/api/magic-trick-telemetry'),
            '. H I rest frequency and Crab pulsar period are ',
            h('span', { className: 'font-semibold text-amber-300/95' }, 'published catalog constants'),
            ', not live phase-lock measurements from this site.',
          ]),
          h('ul', { className: 'mt-4 list-inside list-disc space-y-2 text-[0.68rem] leading-relaxed text-amber-200/75 sm:text-[0.72rem]' }, [
            h('li', null, [
              h('span', { className: 'font-semibold text-amber-400/95' }, 'KiwiSDR: '),
              'no global public API; tune open receivers manually — ',
              h(
                'a',
                {
                  href: 'https://kiwisdr.com/',
                  target: '_blank',
                  rel: 'noopener noreferrer',
                  className: 'text-cyan-400 underline hover:text-cyan-300',
                },
                'kiwisdr.com'
              ),
              '.',
            ]),
            h('li', null, [
              h('span', { className: 'font-semibold text-amber-400/95' }, 'Grid / Schumann / EGS “1.0000”: '),
              'not in NOAA JSON; this page does not fabricate those values.',
            ]),
            h('li', null, [
              h('span', { className: 'font-semibold text-amber-400/95' }, 'Phase row: '),
              'ΔKp between consecutive NOAA 1-min samples — arithmetic only, not an EGS physical product.',
            ]),
          ]),
          h('p', { className: 'mt-4 text-[0.62rem] leading-relaxed text-amber-600/95' }, [
            'Fair exchange clause applies to services; sensor claims above trace to ',
            h('span', { className: 'font-semibold text-amber-500/90' }, 'services.swpc.noaa.gov'),
            ' and cited sources.',
          ]),
        ]
      );
    }

    function AppTelemetrySection() {
      const [telemetry, setTelemetry] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const r = await fetch('/api/magic-trick-telemetry', { signal: AbortSignal.timeout(25000) });
            const j = await r.json();
            if (cancelled) return;
            if (!r.ok || !j.ok) throw new Error(j.error || 'HTTP ' + r.status);
            setTelemetry(j);
          } catch (e) {
            if (!cancelled) setError(e.message || String(e));
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => {
          cancelled = true;
        };
      }, []);
      return h('section', { className: 'mx-auto mt-12 max-w-5xl' }, [
        h('h2', { className: 'mb-4 text-[0.7rem] font-bold uppercase tracking-[0.25em] text-amber-500' }, 'Telemetry · NOAA SWPC (A/B) + ledger (catalog)'),
        h(TelemetryTable, { telemetry: telemetry, loading: loading, error: error }),
        h(DualSourceSyncPanel),
        h('p', { className: 'mt-4 text-[0.65rem] text-amber-700' }, [
          'JSON: ',
          h(
            'a',
            {
              href: '/api/magic-trick-telemetry',
              className: 'text-cyan-400 underline hover:text-cyan-300',
              target: '_blank',
              rel: 'noopener noreferrer',
            },
            '/api/magic-trick-telemetry'
          ),
          ' · Methodology: ',
          h(
            'a',
            {
              href: '/docs/HOUDINI_EQUINOX_MAGIC_TRICK_METHODOLOGY.md',
              className: 'text-cyan-400 underline hover:text-cyan-300',
            },
            'HOUDINI_EQUINOX_MAGIC_TRICK_METHODOLOGY.md'
          ),
          '.',
        ]),
      ]);
    }

    function NarrativeTemplateStamp() {
      const stamp = formatNarrativeTemplateDate();
      useEffect(() => {
        const base = "Sovereign Terminal · March 25 — The 180 Spin Flip · SING 9";
        document.title = base + ' · As displayed ' + stamp;
      }, [stamp]);
      return h(
        'p',
        {
          className: 'mt-2 text-[0.6rem] tabular-nums tracking-wide text-amber-700/90',
          title: 'Updates when you load or refresh this page (browser local date).',
        },
        'Narrative template — as displayed ' + stamp
      );
    }

    function App() {
      return h(
        'div',
        { className: 'relative min-h-screen px-4 py-8 pb-24 sm:px-6' },
        [
          h(
            motion.header,
            {
              className: 'mx-auto max-w-5xl text-center',
              initial: { opacity: 0, y: -12 },
              animate: { opacity: 1, y: 0 },
            },
            [
              h('p', { className: 'text-[0.65rem] uppercase tracking-[0.35em] text-amber-600/90' }, 'Sovereign Terminal · Live public sensors (NOAA)'),
              h(NarrativeTemplateStamp),
              h('h1', { className: 'mt-3 text-xl font-black uppercase tracking-tight text-amber-100 amber-glow sm:text-3xl md:text-4xl' }, "HOUDINI'S MARCH 25: THE 180 SPIN FLIP"),
              h(
                'p',
                { className: 'mx-auto mt-4 max-w-2xl text-[0.75rem] leading-relaxed text-amber-200/70' },
                'Behold — the table loads NOAA SWPC / GOES / RTSW operational JSON (same feeds analysts use). March 25 is the show date; timestamps in column headers are Pacific-local from NOAA time tags.'
              ),
            ]
          ),

          h('section', { className: 'mx-auto mt-10 max-w-5xl' }, h(ProofMeter)),

          h('section', { className: 'mx-auto mt-10 max-w-5xl' }, h(HoudiniUltimateShow)),

          h(AppTelemetrySection),

          h('footer', { className: 'mx-auto mt-16 max-w-5xl text-center text-[0.6rem] text-amber-900' }, 'NSPFRNP → ∞⁹ · SING 9 · No Supabase · Edge only'),
        ]
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
