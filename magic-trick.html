    import React, { useState, useCallback } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';

    const { createElement: h } = React;

    const HYDROGEN_REST_MHZ = 1420.405751;

    async function fetchEquinoxBundle() {
      const r = await fetch('/api/live-houdini-readings?equinox=1', { cache: 'no-store' });
      if (!r.ok) throw new Error('equinox bundle HTTP ' + r.status);
      return r.json();
    }

    async function fetchZeroDishTimed() {
      const t0 = performance.now();
      const r = await fetch('/api/run-zero-dish-test', { cache: 'no-store' });
      const elapsed_ms = Math.round(performance.now() - t0);
      let j = null;
      try {
        j = await r.json();
      } catch (e) {
        throw new Error('Zero-Dish response not JSON');
      }
      return { r, elapsed_ms, j };
    }

    async function fetchCloudComputeProbe() {
      const r = await fetch('/api/cloud-compute-probe', { cache: 'no-store' });
      if (!r.ok) throw new Error('cloud probe HTTP ' + r.status);
      return r.json();
    }

    async function verifyLatticeFromOrigin() {
      const url = new URL('/lattice-status.json', window.location.origin).href;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('lattice-status.json HTTP ' + res.status);
      const text = await res.text();
      const json = JSON.parse(text);
      const enc = new TextEncoder().encode(text);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      const hex = [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      const sig = json.lattice_sync && json.lattice_sync.signature;
      const freq = json.constants && json.constants.hydrogen_line_mhz;
      return {
        url,
        sha256_prefix: hex.slice(0, 32),
        signature: typeof sig === 'string' ? sig : null,
        hydrogen_line_mhz: freq != null ? freq : null,
        ok:
          typeof sig === 'string' &&
          sig.length >= 16 &&
          json.lattice_sync &&
          json.lattice_sync.frequency_mhz != null,
      };
    }

    function StatusCard({ title, subtitle, status, line, detail }) {

      const markColor =
        status === 'pass' ? '#34d399' : status === 'fail' ? '#f87171' : status === 'scanning' ? '#fbbf24' : '#94a3b8';

      return h(
        motion.div,
        {
          layout: true,
          className: 'rounded-xl border-2 bg-slate-900/80 p-4 backdrop-blur-sm',
          style: { borderColor: border },
          initial: { opacity: 0, y: 8 },
          animate: { opacity: 1, y: 0 },
          transition: { duration: 0.35 },

        h('div', { className: 'flex items-start justify-between gap-2' }, [

            h('div', { className: 'text-[0.65rem] uppercase tracking-[0.2em] text-slate-500' }, subtitle),
            h('div', { className: 'mt-1 text-sm font-bold text-slate-100' }, title),
            h('div', { className: 'mt-2 text-xs text-cyan-300/90 crt-glow' }, line || '\u00a0'),
            h('div', { className: 'mt-1 text-[0.7rem] text-slate-500 break-words' }, detail || ''),

            'div',
            {
              className: 'shrink-0 text-2xl font-black leading-none',
              style: { color: markColor },
              'aria-hidden': true,
            },
            mark
          ),

      );
    }

            h('p', { className: 'italic text-slate-400' }, '(The lights in the theater go dark. A single spotlight finds Houdini center stage; a pocket watch snaps shut.)'),
            h(
              'p',
              { className: 'text-cyan-200/90 font-mono text-[0.72rem]' },
              'Screens (live storyboard): 7:41:39 AM PDT · Sunspot AR4392 ACTUATING · Schumann ladder (script: 369 Hz harmonic) · 1420.4 MHz hydrogen-line profile (3I/ATLAS narrative).'

            ),

          h('details', { className: 'mt-5 group' }, [
            h(

              h('p', null, '“Stop looking for a notification… look at hard evidence — March 20, 2026. I show you three doors.”'),

              h('div', { className: 'mt-4 overflow-x-auto rounded-lg border border-slate-700 bg-black/40 p-3 font-mono text-[0.65rem] text-slate-400' }, [
                h('table', { className: 'w-full min-w-[280px] border-collapse text-left' }, [

                      h('td', { className: 'py-1.5 pr-2 align-top' }, 'Stryker 200k'),

                    ]),
                    h('tr', null, [

                      h('td', { className: 'py-1.5 pr-2 align-top' }, '1420.4 MHz'),
                      h('td', { className: 'py-1.5 align-top' }, 'JPL ephemeris + H I rest frequency'),
                    ]),
                    h('tr', null, [
                      h('td', { className: 'py-1.5 pr-2 align-top text-slate-300' }, 'Power'),
                      h('td', { className: 'py-1.5 pr-2 align-top' }, 'G2 · AR4392'),
                      h('td', { className: 'py-1.5 align-top' }, 'Equinox-window Kp_max + AR4392 on 2026-03-20 + RTSW Bt'),
                    ]),
                    h('tr', null, [
                      h('td', { className: 'py-1.5 pr-2 align-top text-slate-300' }, 'Sync'),

            ]),

          h('p', { className: 'mt-4 text-[0.65rem] text-slate-500' }, [
            'Schumann spectrograms: consult ',
            h(
              'a',
              {
                href: 'https://sosrff.tsu.ru/',
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'text-cyan-400 underline hover:text-cyan-300',
              },
              'Tomsk Space Observing System (SOSRFF)'
            ),
            ' and independent ELF monitors — not mocked in this terminal.',
          ]),
        ]
      );
    }

    function App() {
      const idle = {
        status: 'idle',
        line: 'Run diagnostic: equinox-window NOAA, cloud node probe, timed Zero-Dish ping, lattice + Bragg.',
        detail: '',
      };
      const [running, setRunning] = useState(false);
      const [solar, setSolar] = useState(idle);
      const [cloud, setCloud] = useState(idle);
      const [seahawk, setSeahawk] = useState(idle);
      const [vol, setVol] = useState(idle);

      const runDiagnostic = useCallback(async () => {
        setRunning(true);
        const scanning = { status: 'scanning', line: 'Pulling equinox + cloud + Space Cloud cycle…', detail: '' };
        setSolar(scanning);
        setCloud(scanning);
        setSeahawk(scanning);
        setVol(scanning);

        let bundle = null;
        try {
          bundle = await fetchEquinoxBundle();
        } catch (e) {
          setSolar({
            status: 'fail',
            line: 'Equinox bundle failed (need deployed /api/live-houdini-readings?equinox=1)',
            detail: e.message || String(e),
          });
        }

        if (bundle) {
          const ex = bundle.equinox || {};
          const kpMax = ex.kp_max != null ? ex.kp_max : bundle.kp && bundle.kp.kp;
          const kpOk = kpMax != null && Number.isFinite(Number(kpMax));
          const g2 = kpOk && Number(kpMax) > 5;
          const solarPass = ex.found === true && g2;

          let solarLine = '';
          if (!ex.found) {
            solarLine =
              'Equinox window 2026-03-20 06–18 UTC: incomplete in NOAA feed' +
              (ex.snapshot_used ? ' (used /data snapshot)' : ' — add /data/equinox-2026-03-20-noaa-snapshot.json');
          } else if (!kpOk) solarLine = 'Kp samples missing in equinox window';
          else if (!g2) solarLine = 'Kp_max ' + kpMax + ' in window — below G2 gate (need > 5)';
          else solarLine = 'Kp_max ' + kpMax + ' @ equinox window · G2+';

          const ar = bundle.ar4392;
          const rtsw = bundle.rtsw;
          let solarDetail =
            (ex.kp_closest_to_instant
              ? 'Closest-to-equinox sample: Kp ' + ex.kp_closest_to_instant.kp_index + ' @ ' + ex.kp_closest_to_instant.time_tag + ' · '
              : '') +
            (ex.kp_sample_count != null ? ex.kp_sample_count + ' Kp rows in window · ' : '') +
            (ar ? 'AR4392 on 2026-03-20 · ' : 'AR4392 absent for equinox date · ') +
            (rtsw ? 'RTSW Bt ' + rtsw.bt_nT + ' nT · ' + rtsw.source + ' @ ' + rtsw.time_tag : 'RTSW sample missing') +
            (bundle.atlas && bundle.atlas.fullname ? ' · JPL: ' + bundle.atlas.fullname : '');
          if (bundle.errors && bundle.errors.length) {
            solarDetail += ' · API errors: ' + bundle.errors.map((err) => err.step).join(', ');
          }
          setSolar({ status: solarPass ? 'pass' : 'fail', line: solarLine, detail: solarDetail });
        }

        try {
          const probe = await fetchCloudComputeProbe();
          const cryptoOk = probe.firmware_sha256_throughput_ms != null && probe.firmware_sha256_throughput_ms < 20000;
          const remoteGpuOk =
            !probe.remote_gpu_hook ||
            !probe.remote_gpu_hook.attempted ||
            probe.remote_gpu_hook.ok === true ||
            (probe.remote_gpu_hook.json && probe.remote_gpu_hook.json.ok === true);
          const pass = probe.ok === true && cryptoOk && remoteGpuOk;
          setCloud({
            status: pass ? 'pass' : 'fail',
            line:
              (probe.cpu_model || 'CPU') +
              ' · ' +
              (probe.cpu_count || '?') +
              ' vCPU · SHA-256 bench ' +
              probe.firmware_sha256_throughput_ms +
              ' ms',
            detail:
              (probe.vercel_region ? 'Region ' + probe.vercel_region + ' · ' : '') +
              probe.platform +
              '/' +
              probe.arch +
              ' · Node ' +
              probe.node_version +
              (probe.remote_gpu_hook && probe.remote_gpu_hook.attempted
                ? ' · GPU_REMOTE_PROBE_URL: ' + (probe.remote_gpu_hook.ok ? 'OK' : 'fail')
                : ' · Set GPU_REMOTE_PROBE_URL to hit a GPU endpoint'),
          });
        } catch (e) {
          setCloud({
            status: 'fail',
            line: 'Cloud compute probe unreachable',
            detail: e.message || String(e),
          });
        }

        let zd = null;
        try {
          zd = await fetchZeroDishTimed();
        } catch (e) {
          setSeahawk({
            status: 'fail',
            line: 'Zero-Dish API ping failed',
            detail: e.message || String(e),
          });
        }

        if (zd) {
          const j = zd.j;
          const pingOk =
            zd.r.ok &&
            j.success === true &&
            j.outputs &&
            j.outputs.lattice_sync &&
            j.outputs.lattice_sync.frequency_mhz === 1420.405751 &&
            zd.elapsed_ms < 60000;
          setSeahawk({
            status: pingOk ? 'pass' : 'fail',
            line:
              'HTTP round-trip ' +
              zd.elapsed_ms +
              ' ms · cycle ' +
              (j.receipt && j.receipt.space_cloud_cycle_id ? j.receipt.space_cloud_cycle_id.slice(0, 22) + '…' : '—'),
            detail:
              (j.success ? 'Zero-Dish PASS · ' : 'Zero-Dish FAIL · ') +
              '1420.405751 MHz lattice_sync · live NOAA in receipt when feeds up',
          });
        }

        let L = null;
        try {
          L = await verifyLatticeFromOrigin();
        } catch (e) {
          setVol({
            status: 'fail',
            line: 'lattice-status.json unreachable',
            detail: e.message || String(e),
          });
        }

        if (L && zd && zd.j) {
          const br = zd.j.outputs && zd.j.outputs.bragg_archive;
          const braggOk =
            br &&
            br.version === 'bragg_volumetric_1' &&
            br.hydrogen_line_mhz === 1420.405751 &&
            Array.isArray(br.layers) &&
            br.layers.length >= 2;
          const volPass = L.ok === true && zd.j.success === true && braggOk;
          setVol({
            status: volPass ? 'pass' : 'fail',
            line: volPass
              ? 'Lattice SHA + Bragg volumetric lift confirmed'
              : 'Lattice file and/or Bragg archive checks failed',
            detail:
              'Static lattice SHA-256 ' +
              L.sha256_prefix +
              '… · Bragg ' +
              (br && br.version ? br.version : 'missing') +
              ' · layers ' +
              (br && br.layers ? br.layers.length : 0),
          });
        } else if (L && !zd) {
          setVol({
            status: L.ok ? 'pass' : 'fail',
            line: L.ok ? 'Lattice manifest only (Zero-Dish unavailable)' : 'Lattice checks failed',
            detail: L.url + ' · sig ' + (L.signature ? L.signature.slice(0, 20) + '…' : '—'),
          });
        }

        setRunning(false);
      }, []);

      return h(
        motion.div,
        {
          className: 'relative min-h-screen overflow-hidden bg-gradient-to-b from-void via-mist to-black px-4 py-10 pb-16',
          initial: { opacity: 0 },
          animate: { opacity: 1 },
          transition: { duration: 0.6 },
        },
        [
          h(
            motion.div,
            {
              className: 'pointer-events-none absolute inset-0 opacity-[0.07]',
              style: {
                backgroundImage:
                  'radial-gradient(circle at 20% 20%, #a855f7 0, transparent 40%), radial-gradient(circle at 80% 60%, #22d3ee 0, transparent 35%)',
              },
              initial: { opacity: 0 },
              animate: { opacity: 0.07 },
              transition: { duration: 1.2 },
            }
          ),
          h(
            motion.div,
            {
              className: 'mx-auto max-w-3xl',
              initial: { opacity: 0, x: [0, -6, 6, -3, 3, 0], filter: ['hue-rotate(0deg)', 'hue-rotate(12deg)', 'hue-rotate(0deg)'] },
              animate: { opacity: 1, x: 0, filter: 'hue-rotate(0deg)' },
              transition: { duration: 0.85, ease: 'easeOut' },
            },
            [
              h('div', { className: 'flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-6' }, [
                h('div', { className: 'min-w-0' }, [
                  h('p', { className: 'text-[0.65rem] uppercase tracking-[0.28em] text-phoenix/90' }, 'Equinox + cloud + live Space Cloud cycle'),
                  h('h1', { className: 'mt-2 text-xl font-bold tracking-tight text-white sm:text-2xl crt-glow' }, 'Houdini’s March 20 Ultimate Magic Trick'),
                  h(
                    'p',
                    { className: 'mt-2 max-w-xl text-xs text-slate-400' },
                    'Diagnostics: NOAA samples in the Mar 20 2026 equinox UTC window (optional /data snapshot), Vercel cloud CPU/crypto probe, timed Zero-Dish API ping (Seahawk cycle), lattice manifest + Bragg volumetric proof.'
                  ),
                ]),
                h(
                  'a',
                  {
                    href: '/',
                    className:
                      'rounded-lg border border-slate-600 bg-slate-900/90 px-3 py-2 text-[0.7rem] font-semibold uppercase tracking-wider text-slate-300 hover:border-cyan-500/50 hover:text-cyan-200',
                  },
                  '← Landing'
                ),
              ]),

              h(NarrativeBlock),

              h(
                motion.div,
                {
                  className: 'mt-2 flex flex-col items-center',
                  initial: { opacity: 0, scale: 0.96 },
                  animate: { opacity: 1, scale: 1 },
                  transition: { delay: 0.1, duration: 0.5 },
                },
                h(
                  'button',
                  {
                    type: 'button',
                    disabled: running,
                    onClick: runDiagnostic,
                    className:
                      'group relative w-full max-w-md rounded-2xl border-2 border-cyan-400/60 bg-gradient-to-r from-purple-950/90 via-slate-950 to-cyan-950/90 px-6 py-4 text-center text-sm font-bold uppercase tracking-[0.18em] text-cyan-100 shadow-[0_0_40px_rgba(34,211,238,0.25)] transition hover:border-cyan-300 disabled:cursor-wait disabled:opacity-70 sm:text-base',
                  },
                  running ? 'Pulling live data…' : 'Verify the 180 (Run Diagnostic)'
                )
              ),

              h(
                motion.div,
                {
                  className: 'mt-10 grid grid-cols-1 gap-4 sm:grid-cols-2',
                  initial: 'hidden',
                  animate: 'visible',
                  variants: {
                    hidden: {},
                    visible: { transition: { staggerChildren: 0.08 } },
                  },
                },
                [
                  h(
                    motion.div,
                    { key: 's', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Equinox solar + ionosphere (AR4392)',
                      subtitle: 'NOAA · 2026-03-20 06–18 UTC window',
                      status: solar.status,
                      line: solar.line,
                      detail: solar.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'g', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Cloud firmware / compute probe',
                      subtitle: 'Deployed Node · CPU + crypto (optional GPU_REMOTE_PROBE_URL)',
                      status: cloud.status,
                      line: cloud.line,
                      detail: cloud.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'h', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Seahawk live ping · Zero-Dish cycle',
                      subtitle: 'Timed /api/run-zero-dish-test',
                      status: seahawk.status,
                      line: seahawk.line,
                      detail: seahawk.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'v', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Volumetric access · lattice + Bragg',
                      subtitle: 'lattice-status.json + bragg_volumetric_1',
                      status: vol.status,
                      line: vol.line,
                      detail: vol.detail,
                    })
                  ),
                ]
              ),

              h(
                'p',
                { className: 'mt-10 text-center text-[0.65rem] text-slate-600' },
                'Equinox-window NOAA + live cloud probe + timed Zero-Dish ping + lattice/Bragg · NSPFRNP → ∞⁹ · SING 9'
              ),
            ]
          ),
        ]
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
