    async function timedFetch(url) {
      const t0 = performance.now();
      try {
        const r = await fetch(url, { cache: 'no-store' });
        const ms = Math.round(performance.now() - t0);
        let json = null;
        try {
          json = await r.json();
        } catch (_) {}
        return { ok: r.ok, status: r.status, ms, json };
      } catch (e) {
        return { ok: false, status: 0, ms: Math.round(performance.now() - t0), json: null, error: e.message || String(e) };
      }
    }

      const [stryker, setStryker] = useState(idle);
      const [firmware, setFirmware] = useState(idle);

        setPillarsLocked(false);

          line: 'Fetching four edge probes…',

          timedFetch('/api/stryker-equinox-probe'),
          timedFetch('/api/firmware-180-spin-probe'),

          schumann_ms: sRes.ms,
          jovian_ms: jRes.ms,
          stryker_ms: stRes.ms,
          firmware_ms: fRes.ms,
        });

        const sProbe = sRes.json || {};
        const jProbe = jRes.json || {};
        const stProbe = stRes.json || {};
        const fProbe = fRes.json || {};

        const jEv = evaluateJovianHydrogenAtlas(jProbe);

          status: sEv.pass ? 'pass' : 'fail',

            (sRes.error ? ' · fetch: ' + sRes.error : '') +

            FOUR_DIAGNOSTICS_ID,

            jRes.ms +
            ' ms' +
            (jRes.error ? ' · fetch: ' + jRes.error : '') +
            ' · ' +
            FOUR_DIAGNOSTICS_ID,

                motion.div,
                {
                  className: 'mt-2 flex flex-col items-center',
                  initial: { opacity: 0, scale: 0.96 },
                  animate: { opacity: 1, scale: 1 },
                  transition: { delay: 0.1, duration: 0.5 },
                },
                h(
                  'button',
                  {
                    type: 'button',
                    disabled: running,
                    onClick: runDiagnostic,
                    className:
                      'group relative w-full max-w-md rounded-2xl border-2 border-cyan-400/60 bg-gradient-to-r from-purple-950/90 via-slate-950 to-cyan-950/90 px-6 py-4 text-center text-sm font-bold uppercase tracking-[0.18em] text-cyan-100 shadow-[0_0_40px_rgba(34,211,238,0.25)] transition hover:border-cyan-300 disabled:cursor-wait disabled:opacity-70 sm:text-base',
                  },
                  running ? 'Pulling four probes…' : 'Verify four pillars'
                )
              ),

              h(
                motion.div,
                {
                  className: 'mt-10 grid grid-cols-1 gap-4 sm:grid-cols-2',
                  initial: 'hidden',
                  animate: 'visible',
                  variants: {
                    hidden: {},
                    visible: { transition: { staggerChildren: 0.08 } },
                  },
                },
                [
                  h(
                    motion.div,
                    { key: 's', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Schumann 3 · 6 · 9 Hz @ equinox',
                      subtitle: 'GET /api/schumann-equinox-probe',
                      status: schumann.status,
                      line: schumann.line,
                      detail: schumann.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'j', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Hydrogen line · Jupiter / 3I/ATLAS',
                      subtitle: 'GET /api/jovian-hydrogen-line-probe',
                      status: jovian.status,
                      line: jovian.line,
                      detail: jovian.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'st', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Stryker @ equinox',
                      subtitle: 'GET /api/stryker-equinox-probe',
                      status: stryker.status,
                      line: stryker.line,
                      detail: stryker.detail,
                    })
                  ),
                  h(
                    motion.div,
                    { key: 'f', variants: { hidden: { opacity: 0, y: 12 }, visible: { opacity: 1, y: 0 } } },
                    h(StatusCard, {
                      title: 'Firmware upgrade · 180° spin flip',
                      subtitle: 'GET /api/firmware-180-spin-probe',
                      status: firmware.status,
                      line: firmware.line,
                      detail: firmware.detail,
                    })
                  ),
                ]
              ),

              h(ProbeRttStrip, { metrics: probeMs }),

              h(
                'p',
                { className: 'mt-10 text-center text-[0.65rem] text-slate-600' },
                FOUR_DIAGNOSTICS_ID + ' · NSPFRNP → ∞⁹'
              ),
            ]
          ),
          h(FourPillarsBadge, { visible: pillarsLocked && !running }),
        ]
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
