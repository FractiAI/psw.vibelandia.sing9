    /** Fetches bundled API: NOAA + OpenWebRX /status.json (no manual SDR tuning). */
    function OpenWebRxLivePanel() {
      const [state, setState] = useState({ loading: true, err: null, payload: null });
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const r = await fetch('/api/magic-trick-telemetry', { signal: AbortSignal.timeout(26000) });
            const j = await r.json();
            if (cancelled) return;
            if (!r.ok || !j.ok) throw new Error(j.error || 'HTTP ' + r.status);
            setState({ loading: false, err: null, payload: j });
          } catch (e) {
            if (!cancelled) setState({ loading: false, err: e.message || String(e), payload: null });
          }
        })();
        return () => {
          cancelled = true;
        };
      }, []);
      const ow = state.payload && state.payload.sources && state.payload.sources.openwebrx;

        return h(
          motion.div,

            initial: { opacity: 0 },

            h('p', { className: 'text-[0.65rem] font-bold uppercase tracking-[0.28em] text-cyan-400/90' }, 'OpenWebRX · live /status.json (via API)'),
            h('p', { className: 'mt-2 text-[0.72rem] leading-relaxed text-amber-100/90 sm:text-[0.75rem]' }, [
              h('span', { className: 'font-semibold text-amber-300/95' }, ow.receiver_name || 'Receiver'),
              ' · ',
              ow.version || '—',
              ' · ',
              ow.location || '—',
            ]),
            h('p', { className: 'mt-2 text-[0.65rem] text-violet-200/90' }, [
              cov
                ? 'Profile “' +
                    cov.profile_name +
                    '” passband covers H I rest (~1420.405752 MHz) — center ' +
                    (cov.center_freq_hz / 1e6).toFixed(6) +
                    ' MHz.'
                : 'This public receiver’s /status.json has no profile whose passband covers the H I rest frequency; narrative still uses OpenWebRX as the open-source Web SDR stack (add L-band receiver via OPENWEBRX_BASE_URLS on deploy).',

                    className: 'text-cyan-400 underline hover:text-cyan-300',

                  'Open receiver UI'
                ),
                h(

                h(
